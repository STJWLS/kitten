<!-- 个人日程编辑弹窗 -->

<script>
const DAY_CN = ["周一","周二","周三","周四","周五","周六","周日"];
let DATA = null, curWeek = 0;
const DATA_V = "v20260904g";
const EVT_KEY = "emf_schedule_events_v1";
let editingEvtId = null;
const HOURPX = 42;   // 每小时像素高（大格）
const TAG_COLORS = {"课程":"#003da5", "考试":"#c96a5a", "个人":"#b25e83", "学习":"#2e7d8f", "生活":"#2e9e6b", "其他":"#8a7f6d", "导入":"#c98f2f"};

/* ---- 时间工具（0-1440 分钟，10 分钟粒度） ---- */
function fmtMin(m){
  const h = Math.floor(m/60), mm = m%60;
  return String(h).padStart(2,"0") + ":" + String(mm).padStart(2,"0");
}
function parseTimeToMin(hhmm){
  if (!hhmm) return null;
  const [h,m] = hhmm.split(":").map(Number);
  return Math.round((h*60 + m)/10)*10;
}

async function init(){
  const r = await fetch("schedule.af3db431.json");
  DATA = await r.json();
  VenueStore.migrateEvents();   // 旧版 s0/s1 事件 → startMin/endMin + tag
  const m = DATA.meta;
  document.title = m.title + " · Fall 2026";
  document.getElementById("subtitle").textContent = m.subtitle;
  document.getElementById("term").textContent = m.termStart.slice(5).replace("-","/") + " ~ " + m.termEnd.slice(5).replace("-","/");
  document.getElementById("updated").textContent = m.updated;
  const now = new Date();
  const start = new Date(m.termStart + "T00:00:00+08:00");
  const end = new Date(m.termEnd + "T23:59:59+08:00");
  let wk = 0;
  if (now >= start && now <= end) {
    wk = Math.floor((now - start) / (7*864e5)) + 1;
  }
  curWeek = wk;
  document.getElementById("curweek").textContent = wk ? ("Week " + wk) : (now < start ? "未开学" : "已结课");
  const total = end - start;
  const pct = Math.min(100, Math.max(0, ((now - start) / total) * 100));
  document.getElementById("term-progress").style.width = pct.toFixed(1) + "%";
  const cc = document.getElementById("countdown-chip");
  const nxt = nextSession(now);
  if (now < start) {
    cc.innerHTML = "距开学 <b>" + daysUntil(start) + " 天</b>";
  } else if (nxt) {
    cc.innerHTML = "下一节课 <b>" + nxt.course + "</b> · " + nxt.dhms;
  } else {
    cc.innerHTML = "学期已结束";
  }
  buildCards(now, nxt);
  buildWeekTabs();
  buildLegend();
  buildCourseTable();
  buildExams();
  buildHolidays();
  renderMylist();
  refreshPlaceList();
  bindModal();
  bindVenueModal();
  bindDispToggles();
  selectWeek(wk || 1);
  setInterval(()=>{ refreshCountdown(now); }, 1000);
  setTimeout(renderMylist, 2500);
}
function daysUntil(d){ return Math.ceil((d - new Date()) / 864e5); }
function pad(n){ return String(n).padStart(2,"0"); }

function nextSession(now){
  let best = null;
  for (const w of DATA.weeks) for (const day of w.days) {
    for (const s of day.sessions) {
      const c = DATA.courses.find(x=>x.code===s.c);
      if (!c) continue;
      const dt = new Date(day.date + "T" + fmtMin(s.start) + ":00+08:00");
      if (dt <= now) continue;
      const diff = dt - now;
      if (!best || diff < best.diff) best = {diff, dt, course: c.cn || c.code};
    }
  }
  if (best) {
    const d = best.diff;
    const dd = Math.floor(d/864e5), hh = Math.floor(d%864e5/36e5), mm = Math.floor(d%36e5/6e4);
    best.dhms = (dd? dd+"天":"") + pad(hh) + ":" + pad(mm) + ":" + pad((d%6e4)/1e3|0);
    best.when = best.dt.toISOString().slice(0,10);
  }
  return best;
}
function refreshCountdown(now0){
  const nxt = nextSession(new Date());
  const cc = document.getElementById("countdown-chip");
  if (new Date() < new Date(DATA.meta.termStart + "T00:00:00+08:00")) {
    cc.innerHTML = "距开学 <b>" + daysUntil(new Date(DATA.meta.termStart + "T00:00:00+08:00")) + " 天</b>";
  } else if (nxt) cc.innerHTML = "下一节课 <b>" + nxt.course + "</b> · " + nxt.dhms;
}

function buildCards(now, nxt){
  const wk = DATA.weeks.find(w=>w.no===curWeek);
  const weekCnt = wk ? wk.days.reduce((a,d)=>a+d.sessions.length,0) : 0;
  const evtCnt = getEvents().length;
  const nextCn = nxt ? nxt.course : "—";
  const nextWhen = nxt ? nxt.when : "";
  const cards = [
    {num: DATA.courses.length, lab:"课程总数", sub:"含 LIVE/ELP/CARE EN"},
    {num: DATA.courses.reduce((a,c)=>a+c.credit,0), lab:"总学分", sub:"M1 8 + M2 5 + 跨模块 6"},
    {num: weekCnt, lab:"本周课时", sub: curWeek? ("Week " + curWeek) : "未开学"},
    {num: nextCn, lab:"下一节课", sub: nextWhen, cls:"c-next"},
    {num: evtCnt, lab:"我的日程", sub:"本机保存 · 可导出"},
  ];
  document.getElementById("cards").innerHTML = cards.map(c=>
    `<div class="card"><div class="num ${c.cls||''}" ${c.num.length>6?'style="font-size:18px"':''}>${c.num}</div><div class="lab">${c.lab}</div><div class="sub">${c.sub}</div></div>`).join("");
}

function buildWeekTabs(){
  const today = new Date().toISOString().slice(0,10);
  const el = document.getElementById("weektabs");
  el.innerHTML = DATA.weeks.map(w=>{
    const hol = DATA.holidays.some(h=>h.weeks.includes(w.no));
    const isToday = w.start <= today && today <= w.end;
    return `<button class="wt ${hol?'holiday':''} ${isToday?'today':''}" data-w="${w.no}">
      W${w.no}<span class="wkdates">${w.start.slice(5)}</span></button>`;
  }).join("");
  el.querySelectorAll(".wt").forEach(b=>b.addEventListener("click",()=>selectWeek(+b.dataset.w)));
}

function selectWeek(n){
  document.querySelectorAll(".wt").forEach(b=>b.classList.toggle("active",+b.dataset.w===n));
  const w = DATA.weeks.find(x=>x.no===n);
  const hint = document.getElementById("week-hint");
  hint.textContent = w.start + " ~ " + w.end;
  const info = document.getElementById("weekinfo");
  const tags = [];
  DATA.holidays.filter(h=>h.weeks.includes(n)).forEach(h=>tags.push(`<span class="tag">${h.name} ${h.dates[0]} ~ ${h.dates[1]}</span>`));
  DATA.exams.filter(e=>e.week===n).forEach(e=>tags.push(`<span class="tag exam">${e.course} Exam ${e.date} ${e.time}</span>`));
  info.innerHTML = tags.length? tags.join("") : `<span style="color:var(--dim)">无节假日 / 考试安排</span>`;
  renderGrid(w);
}

/* ---- 卡片显示开关（标签/时间/地点/备注） ---- */
const DISP_KEY = "emf_disp_prefs";
function getDisp(){
  try { return Object.assign({tag:true,time:true,venue:true,note:true}, JSON.parse(localStorage.getItem(DISP_KEY)||"{}")); }
  catch(e){ return {tag:true,time:true,venue:true,note:true}; }
}
function bindDispToggles(){
  const prefs = getDisp();
  document.querySelectorAll("#disp-toggles input").forEach(cb=>{
    cb.checked = prefs[cb.dataset.k] !== false;
    cb.addEventListener("change", ()=>{
      prefs[cb.dataset.k] = cb.checked;
      localStorage.setItem(DISP_KEY, JSON.stringify(prefs));
      selectWeek(curWeek || 1);
    });
  });
}
/* 地点信息更全：代码/名称 → 完整名称 + 地址 */
function venueFull(codeOrName){
  if (!codeOrName) return "";
  const v = VenueStore.findVenue(codeOrName);
  if (!v) return codeOrName;
  return v.name + (v.address ? " · " + v.address : "");
}

/* ---- 全天网格（0-24 点，10 分钟粒度；小时为大格，日程块可跨格/跨日；重叠等宽、交叉分段） ---- */
function renderGrid(w){
  const prefs = getDisp();
  const today = new Date().toISOString().slice(0,10);
  const holDays = {};
  DATA.holidays.filter(h=>h.weeks.includes(w.no)).forEach(h=>h.days.forEach(d=>holDays[d]=h.name));
  const evts = getEvents();

  let labels = "";
  for (let h=0; h<24; h++){
    labels += `<div class="hour">${String(h).padStart(2,"0")}:00</div>`;
  }

  let days = "";
  for (let di=0; di<7; di++){
    const day = w.days[di];
    const entries = dayEntries(day, evts);
    const segments = layoutDay(entries);

    let blocksHtml = "";
    for (const seg of segments){
      const e = seg.entry;
      const top = seg.t0/60 * HOURPX;
      const height = Math.max((seg.t1 - seg.t0)/60 * HOURPX, 20);
      const tagColor = TAG_COLORS[e.tag] || "#8a7f6d";
      const bg = e.isExam
        ? "background:linear-gradient(135deg, rgba(201,106,90,.16), rgba(201,106,90,.06));border:1px solid rgba(201,106,90,.55);"
        : e.isEvt
          ? "background:linear-gradient(135deg, rgba(236,159,190,.42), rgba(236,159,190,.18));border:1.5px dashed var(--pink-deep);color:var(--pink-deep);"
          : `background:linear-gradient(135deg,${e.color}55,${e.color}1f);border-left:3px solid ${e.color};`;
      // 可开关的信息项
      const parts = [];
      if (prefs.time && (e.isEvt || e.isExam)) parts.push(fmtMin(seg.t0) + "~" + fmtMin(seg.t1));
      if (prefs.venue && e.venue) parts.push("@ " + venueFull(e.venue));
      if (e.cross) parts.push("跨日");
      if (prefs.note && e.note) parts.push(e.note);
      const tagHtml = prefs.tag ? `<span class="tagchip" style="background:${tagColor}">${e.tag}</span>` : "";
      const subHtml = parts.length ? `<span class="venue">${parts.join(" · ")}</span>` : "";
      blocksHtml += `<div class="evtblock ${e.isEvt?"evt":""}" data-evt="${e.evtId||""}"
        style="top:${top.toFixed(1)}px;height:${height.toFixed(1)}px;left:${seg.left.toFixed(2)}%;width:calc(${seg.width.toFixed(2)}% - 3px);${bg}">
        ${tagHtml}
        <span class="cn">${e.title}</span>
        ${subHtml}
      </div>`;
    }
    const hol = holDays[di];
    days += `<div class="daycol" data-date="${day.date}"${hol?` style="background:linear-gradient(rgba(201,143,47,.07),rgba(201,143,47,.07)),repeating-linear-gradient(to bottom, transparent 0 ${HOURPX-1}px, var(--line) ${HOURPX-1}px ${HOURPX}px)"`:""}>
      ${hol?`<div class="holbadge">${hol}</div>`:""}
      ${blocksHtml}
    </div>`;
  }

  document.getElementById("gridwrap").innerHTML =
    `<div class="g24">
      <div class="g24-labels">${labels}</div>
      <div class="g24-main">
        <div class="g24-head">${w.days.map((d,i)=>`<div class="hd ${d.date===today?'today':''}">${DAY_CN[i]}<span class="d">${d.date.slice(5)}</span></div>`).join("")}</div>
        <div class="g24-days">${days}</div>
      </div>
    </div>`;

  document.querySelectorAll(".daycol").forEach(col=>{
    col.addEventListener("click", e=>{
      if (e.target.closest(".evtblock")) return;
      const rect = col.getBoundingClientRect();
      const offY = e.clientY - rect.top;
      let minute = Math.floor(offY / HOURPX * 60 / 10) * 10;
      minute = Math.min(1430, Math.max(0, minute));
      openEvtModal(col.dataset.date, minute, null);
    });
  });
  document.querySelectorAll(".evtblock.evt").forEach(b=>{
    b.addEventListener("click", e=>{
      e.stopPropagation();
      openEvtModal(null, null, b.dataset.evt);
    });
  });
}

/* 某天的日程条目（课程 + 个人日程；跨日日程按覆盖天拆分） */
function dayEntries(day, evts){
  const entries = [];
  for (const s of day.sessions){
    const c = DATA.courses.find(x=>x.code===s.c);
    entries.push({
      id: "c" + day.date + s.c + s.start, start: s.start, end: s.end,
      tag: s.tag || "课程",
      title: c ? (c.cn || c.name) : "日程",
      venue: s.v || "",
      note: s.note || "",
      cross: false,
      color: c ? c.color : "#d3c39c",
      isExam: (s.tag === "考试")
    });
  }
  for (const e of evts){
    const d0 = e.date, d1 = e.endDate || e.date;
    if (day.date < d0 || day.date > d1) continue;
    const st = (day.date === d0) ? (e.startMin ?? 0) : 0;
    const en = (day.date === d1) ? (e.endMin ?? 1440) : 1440;
    if (en <= st) continue;
    const cross = d0 !== d1;
    entries.push({
      id: e.id, start: st, end: en,
      tag: e.tag || "个人",
      title: "📌 " + e.title,
      venue: e.place || "",
      note: e.note || "",
      cross: cross,
      color: null, isEvt: true, evtId: e.id
    });
  }
  return entries;
}

/* 重叠布局算法：
   1) 按所有起止时间点扫描时间片，每片的活跃日程为一组 → 组内等宽
   2) 同一日程相邻时间片若 (left, width) 不变则合并成一段；
      交叉状态（并行日程数/位置）变化处自动断开分段渲染 */
function layoutDay(entries){
  const pts = new Set();
  for (const e of entries){
    if (e.end <= e.start) continue;
    pts.add(e.start); pts.add(e.end);
  }
  const sorted = [...pts].sort((a,b)=>a-b);
  const byId = new Map();
  const segs = [];
  for (let i=0; i<sorted.length-1; i++){
    const t0 = sorted[i], t1 = sorted[i+1];
    if (t1 <= t0) continue;
    const active = entries.filter(e=>e.start <= t0 && e.end >= t1);
    if (!active.length) continue;
    const n = active.length;
    active.forEach((e, idx)=>{
      const left = idx*100/n, width = 100/n;
      const arr = byId.get(e.id) || [];
      const last = arr[arr.length-1];
      if (last && last.t1 === t0 && Math.abs(last.left-left) < 0.01 && Math.abs(last.width-width) < 0.01){
        last.t1 = t1;   // 相邻且等宽同位 → 合并
      } else {
        const seg = {id: e.id, t0, t1, left, width, entry: e};
        arr.push(seg);
        segs.push(seg);
      }
      byId.set(e.id, arr);
    });
  }
  return segs;
}

function buildLegend(){
  document.getElementById("legend").innerHTML = DATA.courses.map(c=>
    `<span class="leg"><i style="background:${c.color}"></i>${c.code} ${c.cn}</span>`).join("") +
    `<span class="leg"><i style="background:var(--pink)"></i>📌 我的日程</span>` +
    Object.entries(TAG_COLORS).map(([t,c])=>`<span class="leg"><i style="background:${c}"></i>标签 ${t}</span>`).join("");
}

function buildCourseTable(){
  const html = `<tr><th>模块</th><th>课程</th><th>缩写</th><th>学分</th><th>教授</th><th>上课地点</th></tr>` +
  DATA.courses.map(c=>{
    const mod = c.module==="M1"?"Module 1":c.module==="M2"?"Module 2":"M1-M2";
    const profEn = c.prof_en && c.prof_en !== c.prof
      ? `<br><span style="color:var(--dim);font-size:11px">${c.prof_en}</span>` : "";
    return `<tr>
      <td><span class="mod-tag">${mod}</span></td>
      <td>${c.name}<br><span style="color:var(--dim);font-size:11px">${c.cn}</span></td>
      <td><span class="codechip" style="background:${c.color}">${c.code}</span></td>
      <td class="cr">${c.credit}</td>
      <td>${c.prof}${profEn}</td>
      <td style="font-family:var(--mono);font-size:11.5px;color:var(--muted)">${c.venues}</td>
    </tr>`;
  }).join("");
  document.getElementById("coursetable").innerHTML = html;
}

function buildExams(){
  document.getElementById("exams").innerHTML =
    `<h2 style="margin-top:0">考试 <span class="hint">EXAMS</span></h2>` +
    DATA.exams.map(e=>`<div class="mini"><div class="t"><span>${e.course} · ${e.cn}</span><span class="d">${e.date}</span></div>
      <div class="s">${e.time}（Week ${e.week} · ${DAY_CN[e.day]}）</div></div>`).join("") +
    `<div class="s" style="color:var(--dim);font-family:var(--mono);font-size:11px;padding:0 2px">MIE / PFV / COF / AIC 考试未排入课表，另行通知</div>`;
}
function buildHolidays(){
  const seen = {};
  DATA.holidays.forEach(h=>{
    const k = h.name + h.dates.join();
    if (!seen[k]) seen[k] = h;
  });
  document.getElementById("holidays").innerHTML =
    `<h2 style="margin-top:0">节假日 <span class="hint">HOLIDAYS</span></h2>` +
    Object.values(seen).map(h=>`<div class="mini"><div class="t"><span>${h.name} ${h.en}</span><span class="d">${h.dates[0]} ~ ${h.dates[1]}</span></div>
      <div class="s">Week ${h.weeks.join(" / ")}</div></div>`).join("");
}

/* ============ 个人日程（全天 10 分钟粒度） ============ */
function getEvents(){
  try { return JSON.parse(localStorage.getItem(EVT_KEY) || "[]"); } catch(e) { return []; }
}
function saveEvents(arr){ localStorage.setItem(EVT_KEY, JSON.stringify(arr)); }

function openEvtModal(date, minute, id){
  editingEvtId = id || null;
  const evt = id ? getEvents().find(e=>e.id===id) : null;
  document.getElementById("evt-modal-title").textContent = evt ? "编辑日程" : "添加日程";
  document.getElementById("evt-date").value = evt ? evt.date : date;
  document.getElementById("evt-edate").value = evt ? (evt.endDate || evt.date) : date;
  const sh = document.getElementById("evt-sh"), sm = document.getElementById("evt-sm");
  const eh = document.getElementById("evt-eh"), em = document.getElementById("evt-em");
  sh.innerHTML = Array.from({length:24},(_,i)=>`<option value="${i}">${String(i).padStart(2,"0")}时</option>`).join("");
  eh.innerHTML = Array.from({length:25},(_,i)=>`<option value="${i}">${String(i).padStart(2,"0")}时</option>`).join("");
  sm.innerHTML = em.innerHTML = ["00","10","20","30","40","50"].map(v=>`<option value="${v}">${v}分</option>`).join("");
  const s = evt ? evt.startMin : (minute ?? 0);
  const en = evt ? evt.endMin : Math.min(1440, (minute ?? 0) + 60);
  sh.value = Math.floor(s/60); sm.value = String(s%60).padStart(2,"0");
  eh.value = Math.floor(en/60); em.value = String(en%60).padStart(2,"0");
  document.getElementById("evt-title").value = evt ? evt.title : "";
  document.getElementById("evt-tag").value = evt && evt.tag ? evt.tag : "个人";
  document.getElementById("evt-place").value = evt ? (evt.place||"") : "";
  document.getElementById("evt-place").dataset.placeCode = evt && evt.placeCode ? evt.placeCode : "";
  document.getElementById("evt-note").value = evt ? (evt.note||"") : "";
  document.getElementById("evt-del").style.display = evt ? "" : "none";
  document.getElementById("evt-modal").style.display = "flex";
  document.getElementById("evt-title").focus();
}
function closeEvtModal(){
  document.getElementById("evt-modal").style.display = "none";
  editingEvtId = null;
}
function saveEvt(){
  const title = document.getElementById("evt-title").value.trim();
  if (!title){ alert("请填写日程标题"); return; }
  const date = document.getElementById("evt-date").value;
  const endDate = document.getElementById("evt-edate").value || date;
  const startMin = (+document.getElementById("evt-sh").value)*60 + (+document.getElementById("evt-sm").value);
  const endMin = (+document.getElementById("evt-eh").value)*60 + (+document.getElementById("evt-em").value);
  const sKey = date + "T" + fmtMin(startMin);
  const eKey = endDate + "T" + fmtMin(endMin);
  if (eKey <= sKey){ alert("结束时间必须晚于开始时间"); return; }
  const arr = getEvents();
  const placeEl = document.getElementById("evt-place");
  const obj = {id: editingEvtId || ("e" + Date.now().toString(36) + Math.floor(Math.random()*46656).toString(36)),
               date, startMin, endMin, endDate, title,
               tag: document.getElementById("evt-tag").value,
               place: placeEl.value.trim(),
               note: document.getElementById("evt-note").value.trim()};
  if (placeEl.dataset.placeCode) obj.placeCode = placeEl.dataset.placeCode;
  if (editingEvtId){
    const i = arr.findIndex(e=>e.id===editingEvtId);
    if (i>=0) arr[i] = obj;
  } else {
    arr.push(obj);
  }
  saveEvents(arr);
  closeEvtModal();
  selectWeek(curWeek || 1);
  renderMylist();
  buildCards();
}
function delEvt(){
  if (!editingEvtId) return;
  saveEvents(getEvents().filter(e=>e.id!==editingEvtId));
  closeEvtModal();
  selectWeek(curWeek || 1);
  renderMylist();
  buildCards();
}
function bindModal(){
  document.getElementById("evt-save").addEventListener("click", saveEvt);
  document.getElementById("evt-cancel").addEventListener("click", closeEvtModal);
  document.getElementById("evt-del").addEventListener("click", delEvt);
  document.getElementById("evt-modal").addEventListener("click", e=>{
    if (e.target === document.getElementById("evt-modal")) closeEvtModal();
  });
  document.getElementById("evt-export").addEventListener("click", exportEvents);
  document.getElementById("evt-import").addEventListener("click", ()=>{
    document.getElementById("evt-import-file").click();
  });
  document.getElementById("evt-import-file").addEventListener("change", importEvents);
}
function exportEvents(){
  const blob = new Blob([JSON.stringify(getEvents(), null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "emf_events_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
}
function importEvents(){
  const f = document.getElementById("evt-import-file").files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try {
      const text = String(rd.result || "");
      const name = (f.name || "").toLowerCase();
      let arr;
      if (name.endsWith(".ics") || /^BEGIN:VCALENDAR/m.test(text)) arr = parseIcs(text);
      else if (name.endsWith(".csv")) arr = parseCsv(text);
      else {
        const t = text.trim();
        arr = t.startsWith("[") ? JSON.parse(t) : parseCsv(t);
      }
      if (!Array.isArray(arr) || !arr.length) throw new Error("no rows");
      let added = 0, skipped = 0;
      const cur = getEvents();
      const ids = new Set(cur.map(e=>e.id));
      for (const e of arr){
        if (e && e.id && e.date && !ids.has(e.id)){ cur.push(e); ids.add(e.id); added++; }
        else skipped++;
      }
      saveEvents(cur);
      selectWeek(curWeek || 1);
      renderMylist();
      buildCards();
      alert("导入完成：新增 " + added + " 条，跳过 " + skipped + " 条");
    } catch(e) { alert("文件解析失败（支持 .json / .ics / .csv）：" + (e.message||e)); }
    document.getElementById("evt-import-file").value = "";
  };
  rd.readAsText(f, "utf-8");
}
function newEvtId(seed){
  return "i" + Math.abs(seed.split("").reduce((a,c)=>(a*31 + c.charCodeAt(0))|0, 0)).toString(36) + Math.floor(Math.random()*46656).toString(36);
}
function parseIcs(text){
  const out = [];
  const blocks = text.split(/BEGIN:VEVENT/).slice(1);
  for (const b of blocks){
    const grab = (k)=>{ const m = b.match(new RegExp("^" + k + "[^:\\n]*:([^\\n]+)", "m")); return m ? m[1].trim() : ""; };
    let dt = grab("DTSTART").replace(/^.*:/, "");
    if (/^VALUE=DATE/.test(grab("DTSTART"))) dt = b.match(/VALUE=DATE:(\d{8})/)?.[1] || dt;
    if (!dt) continue;
    const date = dt.slice(0,4) + "-" + dt.slice(4,6) + "-" + dt.slice(6,8);
    let t0 = dt.includes("T") ? dt.slice(9,13) : "";
    let tend = grab("DTEND").replace(/^.*:/, "");
    let t1 = tend.includes("T") ? tend.slice(9,13) : "";
    const startMin = parseTimeToMin(t0.slice(0,2) + ":" + t0.slice(2)) ?? 0;
    let endMin = parseTimeToMin(t1.slice(0,2) + ":" + t1.slice(2));
    if (endMin === null || endMin <= startMin) endMin = Math.min(1440, startMin + 60);
    out.push({
      id: newEvtId(date + dt + (grab("SUMMARY")||"")), date, startMin, endMin,
      tag: "导入",
      title: grab("SUMMARY") || "导入日程",
      place: grab("LOCATION") || "",
      note: grab("DESCRIPTION") || ""
    });
  }
  return out;
}
function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if (!lines.length) return [];
  const sep = lines[0].includes(",") ? "," : (lines[0].includes(";") ? ";" : "\t");
  const head = lines[0].split(sep).map(h=>h.trim());
  const idx = {};
  head.forEach((h,i)=>{
    if (/^(date|日期)$/i.test(h)) idx.date = i;
    else if (/^(start|开始|starttime|start_time)$/i.test(h)) idx.s0 = i;
    else if (/^(end|结束|endtime|end_time)$/i.test(h)) idx.s1 = i;
    else if (/^(title|标题|summary|主题)$/i.test(h)) idx.title = i;
    else if (/^(place|地点|location)$/i.test(h)) idx.place = i;
    else if (/^(note|备注|desc|description)$/i.test(h)) idx.note = i;
  });
  if (idx.date === undefined) throw new Error("CSV 缺少日期列");
  const out = [];
  for (let li=1; li<lines.length; li++){
    const c = lines[li].split(sep).map(x=>x.trim().replace(/^"|"$/g,""));
    if (!c[idx.date]) continue;
    const d = c[idx.date].replace(/[./年]/g,"-").replace(/月/g,"-").replace(/日/g,"");
    const dparts = d.split("-").map(Number);
    const date = dparts[0] >= 1000 ? dparts[0] + "-" + String(dparts[1]).padStart(2,"0") + "-" + String(dparts[2]).padStart(2,"0") : d;
    const startMin = idx.s0 !== undefined ? (parseTimeToMin(c[idx.s0]) ?? 0) : 0;
    let endMin = idx.s1 !== undefined ? parseTimeToMin(c[idx.s1]) : null;
    if (endMin === null || endMin <= startMin) endMin = Math.min(1440, startMin + 60);
    out.push({
      id: newEvtId(lines[li]), date, startMin, endMin,
      tag: "导入",
      title: (idx.title !== undefined && c[idx.title]) ? c[idx.title] : "导入日程",
      place: idx.place !== undefined ? c[idx.place] : "",
      note: idx.note !== undefined ? c[idx.note] : ""
    });
  }
  return out;
}
function renderMylist(){
  const evts = getEvents().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.startMin??0)-(b.startMin??0));
  const hint = document.getElementById("mylist-hint");
  const backend = (typeof LocalBackend !== "undefined" && LocalBackend.online()) ? " · 本机存储已连接" : " · 本机存储未连接";
  hint.textContent = (evts.length ? ("共 " + evts.length + " 条") : "点击周课表空格添加") + backend;
  const el = document.getElementById("mylist");
  if (!evts.length){
    el.innerHTML = `<div class="mylist-empty">还没有个人日程 — 点击上方周课表里的空白位置即可添加（10 分钟粒度 / 标签 / 地点 / 备注）</div>`;
    return;
  }
  el.innerHTML = evts.map(e=>{
    const g = new Date(e.date + "T00:00:00").getDay();
    const dayCn = DAY_CN[(g + 6) % 7];
    const start = new Date(DATA.meta.termStart + "T00:00:00+08:00");
    const wk = Math.max(1, Math.min(DATA.meta.totalWeeks,
      Math.floor((new Date(e.date + "T00:00:00+08:00") - start) / (7*864e5)) + 1));
    const tag = e.tag || "个人";
    const tagColor = TAG_COLORS[tag] || "#8a7f6d";
    const cross = e.endDate && e.endDate !== e.date;
    const range = cross
      ? `${e.date} ${fmtMin(e.startMin)} ~ ${e.endDate} ${fmtMin(e.endMin)}（跨日）`
      : `${e.date}（W${wk} ${dayCn}）${fmtMin(e.startMin)} ~ ${fmtMin(e.endMin)}`;
    const meta = range + (e.place ? " · " + e.place : "") + (e.note ? " · " + e.note : "");
    return `<div class="mylist-item">
      <div class="mk" style="background:${tagColor}"></div>
      <div class="body">
        <div class="t"><span class="tagchip" style="background:${tagColor}">${tag}</span> 📌 ${e.title}</div>
        <div class="meta">${meta}</div>
      </div>
      <div class="ops">
        <button data-e="${e.id}" class="op-edit">编辑</button>
        <button data-e="${e.id}" class="op-del">删除</button>
      </div>
    </div>`;
  }).join("");
  el.querySelectorAll(".op-edit").forEach(b=>b.addEventListener("click",()=>openEvtModal(null,null,b.dataset.e)));
  el.querySelectorAll(".op-del").forEach(b=>b.addEventListener("click",()=>{
    saveEvents(getEvents().filter(e=>e.id!==b.dataset.e));
    selectWeek(curWeek || 1);
    renderMylist();
    buildCards();
  }));
}

/* ============ 地点选择 + 新建（统一组件，见 assets/venues.js） ============ */
function refreshPlaceList(){
  PlacePicker.attach(document.getElementById("evt-place"));
}
function bindVenueModal(){
  document.getElementById("evt-newplace").addEventListener("click", function(){
    VenueEditor.open({onSaved: function(v){
      refreshPlaceList();
      document.getElementById("evt-place").value = v.name;
      document.getElementById("evt-place").dataset.placeCode = v.code;
    }});
  });
}
