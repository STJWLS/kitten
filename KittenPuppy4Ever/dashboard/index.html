<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KittenPuppy4Ever</title>
<style>
html,body{margin:0;padding:0;height:100%;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;
  background:linear-gradient(160deg,#f8f4ec 0%,#f4eadf 52%,#eee1d6 100%);color:#42392b;}
/* 连接卡与登录页同款渐变背景：iframe 淡入时视觉连贯 */
.entry-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
.entry-orb.e1{width:440px;height:440px;top:-120px;left:-100px;
  background:radial-gradient(circle, rgba(246,184,207,.65) 0%, rgba(246,184,207,.22) 46%, rgba(246,184,207,0) 72%);
  animation:fl 22s ease-in-out infinite alternate;}
.entry-orb.e2{width:420px;height:420px;bottom:-110px;right:-90px;
  background:radial-gradient(circle, rgba(168,196,239,.65) 0%, rgba(168,196,239,.22) 46%, rgba(168,196,239,0) 72%);
  animation:fl 26s ease-in-out infinite alternate-reverse;}
@keyframes fl{from{transform:translate(0,0) scale(1)}to{transform:translate(46px,34px) scale(1.14)}}
iframe.frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f8f4ec;
  opacity:0;transition:opacity .65s ease .05s;z-index:2;}
.box{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;
  transition:opacity .5s ease, transform .5s ease;}
.box.fade-out{opacity:0;transform:translateY(-14px);pointer-events:none;}
.card{position:relative;background:rgba(255,255,255,.94);
  border:1px solid rgba(255,255,255,.75);border-radius:20px;padding:34px 44px;
  max-width:460px;text-align:center;box-shadow:0 18px 60px rgba(66,57,43,.16);
  animation:in .55s cubic-bezier(.22,1,.36,1);}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
h1{font-size:20px;margin:0 0 4px;font-family:monospace;}
h1 .pets{display:inline-block;animation:pet 1.6s ease-in-out infinite;}
@keyframes pet{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.06)}40%{transform:rotate(6deg)}60%{transform:rotate(0)}}
#status{font-size:13px;color:#8a7f6d;margin:12px 0 4px;font-family:monospace;}
.dots{display:inline-flex;gap:5px;align-items:center;}
.dots i{width:7px;height:7px;border-radius:50%;display:inline-block;
  background:linear-gradient(135deg,#003da5,#ec9fbe);
  animation:blink 1.2s ease-in-out infinite;}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.hint{font-size:11px;color:#b5a88f;line-height:1.7;margin-top:14px;}
code{background:rgba(242,236,223,.7);border-radius:5px;padding:1px 7px;font-family:monospace;font-size:11px;}
</style>
</head>
<body>
<iframe class="frame" id="frame" style="display:none"></iframe>
<div class="entry-orb e1"></div>
<div class="entry-orb e2"></div>
<div class="box" id="box">
  <div class="card">
    <h1><span class="pets">🐱🐶</span> KittenPuppy4Ever</h1>
    <p id="status"><span class="dots"><i></i><i></i><i></i></span> 正在连接工作台…</p>
    <p class="hint">
      工作台由<b>本机服务</b>交付（零 CDN · 改完即刷）。<br>
      若长时间停留在此：请在本机运行 <code>start_public_dash.bat</code> 启动隧道，<br>
      或直接访问 <a href="http://127.0.0.1:8767/">http://127.0.0.1:8767/</a>
    </p>
  </div>
</div>
<script>
(function(){
  const pathname = location.pathname;
  // 多层级 URL 嵌套：/kitten/KittenPuppy4Ever[/dashboard[/map]]/
  //   → iframe 内隧道路径：/ | /dashboard/ | /dashboard/map/
  const prefix = "/kitten/KittenPuppy4Ever/";
  let path = "/";
  if (pathname.indexOf(prefix) === 0){
    path = "/" + pathname.slice(prefix.length);
  }
  // entry.json 位置：按路径深度向上找（/ → 同目录；/dashboard/ → ../；/dashboard/map/ → ../../）
  const depth = path.split("/").filter(Boolean).length;
  const rel = new Array(depth + 1).join("../") + "entry.json";
  const status = function(t){ document.getElementById("status").innerHTML = t; };
  // 子页面路径同步到地址栏（replaceState 不刷新不跳转）
  window.addEventListener("message", function(e){
    const p = e.data && e.data.dashPath;
    if (typeof p === "string" && (p === "/" || p.indexOf("/") === 0)){
      const want = "/kitten/KittenPuppy4Ever" + p + location.search;
      if (location.pathname + location.search !== want){
        history.replaceState(null, "", want);
      }
    }
  });
  fetch(rel + "?ts=" + Date.now(), {cache:"no-store"})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.url){
        status('<span class="dots"><i></i><i></i><i></i></span> 已连接，正在进入工作台…');
        const f = document.getElementById("frame");
        f.style.display = "";
        f.onload = function(){
          // 连贯动画：连接卡淡出上移，iframe（登录/工作台）同步淡入
          document.getElementById("box").classList.add("fade-out");
          f.style.opacity = "1";
          setTimeout(function(){
            document.getElementById("box").style.display = "none";
          }, 700);
        };
        f.src = d.url.replace(/\/+$/, "") + (path || "/");
        setTimeout(function(){
          if (!f.style.opacity || f.style.opacity === "0"){
            status("连接超时（隧道可能已断开，本机运行 start_public_dash.bat 后刷新）");
          }
        }, 15000);
      } else {
        status("工作台服务未运行（入口配置为空）");
      }
    })
    .catch(function(e){
      status("无法读取入口配置：" + e.message);
    });
})();
</script>
</body>
</html>
