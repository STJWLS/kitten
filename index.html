<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>EMF 26R 课程看板</title>
<style>
  :root{
    --bg0:#0a1120; --bg1:#0f1830; --bg2:#16213a;
    --line:#22314a; --line2:#2b3d5c;
    --text:#e7eef8; --muted:#8fa0bb; --dim:#56688a;
    --accent:#35d6ee; --green:#3ddb95; --amber:#f6b93b;
    --red:#f2716e; --violet:#a78bfa; --slate:#5b6d8c;
    --mono:"JetBrains Mono","Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--text);
    background:
      radial-gradient(1000px 420px at 50% -8%, rgba(53,214,238,.07), transparent 60%),
      radial-gradient(800px 400px at 100% 0%, rgba(167,139,250,.05), transparent 55%),
      var(--bg0);
    -webkit-font-smoothing:antialiased;}

  /* header */
  header{background:linear-gradient(180deg, rgba(18,28,50,.9), rgba(12,19,34,.55));
    border-bottom:1px solid var(--line);padding:16px 22px 0;}
  header .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px;
    display:flex;align-items:center;gap:10px;}
  header h1::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--accent);
    box-shadow:0 0 12px rgba(53,214,238,.8);}
  header h1 small{font-size:12px;font-weight:400;color:var(--muted);font-family:var(--mono);}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);
    font-family:var(--mono);margin-left:auto;}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg1);
    border:1px solid var(--line);border-radius:999px;padding:3px 11px;}
  .chip b{color:var(--accent);font-weight:600;}
  .chip .warn{color:var(--amber);}
  .countbar{height:2px;background:var(--bg2);margin-top:12px;border-radius:1px;overflow:hidden;}
  .countbar i{display:block;height:100%;background:var(--accent);opacity:.9;}

  main{max-width:1280px;margin:0 auto;padding:18px 20px 8px;}

  /* stat cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .card{background:var(--bg1);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 12px;text-align:center;transition:border-color .15s,transform .15s;}
  .card:hover{border-color:var(--line2);transform:translateY(-1px);}
  .card .num{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1.05;}
  .card .lab{font-size:11.5px;color:var(--muted);margin-top:7px;letter-spacing:.2px;}
  .card .sub{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:4px;}

  /* sections */
  section{background:var(--bg1);border:1px solid var(--line);border-radius:var(--r);
    padding:18px 20px;margin-bottom:18px;}
  section h2{margin:0 0 14px;font-size:15px;font-weight:600;
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  section h2::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent);}
  section h2 .hint{font-weight:400;color:var(--dim);font-size:12px;font-family:var(--mono);margin-left:auto;}

  /* week tabs */
  .weektabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
  .wt{position:relative;background:var(--bg2);border:1px solid var(--line);color:var(--muted);
    font-family:var(--mono);font-size:12px;border-radius:8px;padding:5px 10px;cursor:pointer;
    transition:border-color .15s,color .15s;white-space:nowrap;}
  .wt:hover{border-color:var(--line2);color:var(--text);}
  .wt.active{background:rgba(53,214,238,.12);border-color:var(--accent);color:var(--accent);font-weight:600;}
  .wt.holiday::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;
    border-radius:50%;background:var(--amber);}
  .wt.today{border-color:var(--green);}
  .wt .wkdates{display:block;font-size:9.5px;color:var(--dim);font-weight:400;margin-top:2px;}

  /* week info line */
  .weekinfo{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;font-family:var(--mono);
    color:var(--muted);margin:8px 0 14px;}
  .weekinfo .tag{background:rgba(246,185,59,.12);border:1px solid rgba(246,185,59,.3);
    color:var(--amber);border-radius:6px;padding:2px 8px;}
  .weekinfo .tag.exam{background:rgba(242,113,110,.12);border-color:rgba(242,113,110,.3);color:var(--red);}

  /* weekly grid */
  .gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  table.grid{border-collapse:collapse;width:100%;min-width:980px;table-layout:fixed;}
  table.grid th,table.grid td{border:1px solid var(--line);}
  table.grid thead th{font-size:11.5px;font-weight:600;color:var(--muted);
    background:var(--bg2);padding:7px 4px;text-align:center;}
  table.grid thead th .d{font-family:var(--mono);font-weight:400;color:var(--dim);display:block;font-size:10px;}
  table.grid thead th.today{color:var(--green);background:rgba(61,219,149,.08);}
  table.grid td.time{width:76px;font-family:var(--mono);font-size:10.5px;color:var(--dim);
    text-align:center;vertical-align:middle;background:var(--bg2);}
  table.grid td{height:44px;vertical-align:top;padding:0;position:relative;}
  .cell{position:absolute;inset:1px;border-radius:6px;padding:4px 6px;overflow:hidden;
    font-size:11px;line-height:1.35;border-left:3px solid transparent;}
  .cell .cn{color:inherit;font-weight:600;font-size:11.5px;}
  .cell .en{font-family:var(--mono);font-size:9.5px;opacity:.85;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cell .venue{font-family:var(--mono);font-size:9px;opacity:.75;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cell .note{font-size:9.5px;opacity:.9;}
  .cell.holiday{background:linear-gradient(135deg, rgba(246,185,59,.10), rgba(246,185,59,.04));
    border:1px dashed rgba(246,185,59,.45);color:var(--amber);
    display:flex;align-items:center;justify-content:center;font-weight:600;}
  .cell.exam{background:linear-gradient(135deg, rgba(242,113,110,.14), rgba(242,113,110,.05));
    border:1px solid rgba(242,113,110,.5);}
  .cell.live{background:linear-gradient(135deg, rgba(94,234,212,.12), rgba(94,234,212,.03));
    border:1px dashed rgba(94,234,212,.45);}

  /* course legend + table */
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .leg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
    background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;}
  .leg i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  table.list{border-collapse:collapse;width:100%;font-size:12.5px;}
  table.list th,table.list td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);}
  table.list th{color:var(--dim);font-weight:600;font-size:11px;font-family:var(--mono);
    background:var(--bg2);letter-spacing:.4px;}
  table.list td{color:var(--text);}
  table.list tr:hover td{background:rgba(53,214,238,.04);}
  .mod-tag{font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:5px;
    border:1px solid var(--line2);color:var(--muted);white-space:nowrap;}
  .cr{font-family:var(--mono);color:var(--accent);}

  /* exams & holidays two-col */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:860px){.two{grid-template-columns:1fr;}}
  .mini{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .mini .t{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .mini .t .d{font-family:var(--mono);color:var(--amber);font-size:12px;margin-left:auto;}
  .mini .s{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:4px;}

  .foot{color:var(--dim);font-family:var(--mono);font-size:11px;text-align:center;
    padding:14px 0 26px;}
  .foot a{color:var(--dim);}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>EMF 26R 课程看板 <small id="subtitle">Course Schedule · Fall 2026</small></h1>
    <div class="meta">
      <span class="chip">学期 <b id="term"></b></span>
      <span class="chip">当前 <b id="curweek"></b></span>
      <span class="chip" id="countdown-chip"></span>
      <span class="chip">数据更新 <b id="updated"></b></span>
    </div>
  </div>
  <div class="countbar"><i id="term-progress"></i></div>
</header>
<main>
  <div class="cards" id="cards"></div>

  <section>
    <h2>周课表 <span class="hint" id="week-hint"></span></h2>
    <div class="weektabs" id="weektabs"></div>
    <div class="weekinfo" id="weekinfo"></div>
    <div class="gridwrap">
      <table class="grid" id="grid"></table>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2>课程信息 <span class="hint">11 门 · 19 学分</span></h2>
    <div class="table-wrap"><table class="list" id="coursetable"></table></div>
  </section>

  <section>
    <h2>考试与节假日 <span class="hint">EXAMS & HOLIDAYS</span></h2>
    <div class="two">
      <div><div id="exams"></div></div>
      <div><div id="holidays"></div></div>
    </div>
  </section>

  <div class="foot">
    数据源：官方课程表 PDF（MinerU 解析 · 坐标重建核验）｜ 静态看板 · GitHub Pages
    ｜ <a href="https://github.com/STJWLS/emf-schedule" target="_blank">仓库</a>
  </div>
</main>

<script>
const DAY_CN = ["周一","周二","周三","周四","周五","周六","周日"];
let DATA = null, curWeek = 0;

async function init(){
  const r = await fetch("schedule.json");
  DATA = await r.json();
  const m = DATA.meta;
  document.title = m.title + " · Fall 2026";
  document.getElementById("subtitle").textContent = m.subtitle;
  document.getElementById("term").textContent = m.termStart.slice(5).replace("-","/") + " ~ " + m.termEnd.slice(5).replace("-","/");
  document.getElementById("updated").textContent = m.updated;
  const now = new Date();
  const start = new Date(m.termStart + "T00:00:00+08:00");
  const end = new Date(m.termEnd + "T23:59:59+08:00");
  const today = now.toISOString().slice(0,10);
  // current week
  let wk = 0;
  if (now >= start && now <= end) {
    wk = Math.floor((now - start) / (7*864e5)) + 1;
  }
  curWeek = wk;
  document.getElementById("curweek").textContent = wk ? ("Week " + wk) : (now < start ? "未开学" : "已结课");
  const total = end - start;
  const pct = Math.min(100, Math.max(0, ((now - start) / total) * 100));
  document.getElementById("term-progress").style.width = pct.toFixed(1) + "%";
  // countdown chip
  const cc = document.getElementById("countdown-chip");
  const nxt = nextSession(now);
  if (now < start) {
    cc.innerHTML = "距开学 <b>" + daysUntil(start) + " 天</b>";
  } else if (nxt) {
    cc.innerHTML = "下一节课 <b>" + nxt.course + "</b> · " + nxt.dhms;
  } else {
    cc.innerHTML = "学期已结束";
  }
  buildCards(now, nxt);
  buildWeekTabs();
  buildLegend();
  buildCourseTable();
  buildExams();
  buildHolidays();
  selectWeek(wk || 1);
  // 每秒更新倒计时
  setInterval(()=>{ refreshCountdown(now); }, 1000);
}
function daysUntil(d){ return Math.ceil((d - new Date()) / 864e5); }
function pad(n){ return String(n).padStart(2,"0"); }

function nextSession(now){
  // 找今天之后的最近一节
  let best = null;
  for (const w of DATA.weeks) for (const day of w.days) {
    for (const s of day.sessions) {
      const c = DATA.courses.find(x=>x.code===s.c);
      if (!c) continue;
      const t = DATA.slots[s.s].label.split("-")[0];
      const dt = new Date(day.date + "T" + t + ":00+08:00");
      if (dt <= now) continue;
      const diff = dt - now;
      if (!best || diff < best.diff) best = {diff, dt, course: c.cn || c.code};
    }
  }
  if (best) {
    const d = best.diff;
    const dd = Math.floor(d/864e5), hh = Math.floor(d%864e5/36e5), mm = Math.floor(d%36e5/6e4);
    best.dhms = (dd? dd+"天":"") + pad(hh) + ":" + pad(mm) + ":" + pad((d%6e4)/1e3|0);
    best.when = best.dt.toISOString().slice(0,10);
  }
  return best;
}
function refreshCountdown(now0){
  const nxt = nextSession(new Date());
  const cc = document.getElementById("countdown-chip");
  if (new Date() < new Date(DATA.meta.termStart + "T00:00:00+08:00")) {
    cc.innerHTML = "距开学 <b>" + daysUntil(new Date(DATA.meta.termStart + "T00:00:00+08:00")) + " 天</b>";
  } else if (nxt) cc.innerHTML = "下一节课 <b>" + nxt.course + "</b> · " + nxt.dhms;
}

function buildCards(now, nxt){
  const m = DATA.meta;
  const wk = DATA.weeks.find(w=>w.no===curWeek);
  const weekCnt = wk ? wk.days.reduce((a,d)=>a+d.sessions.length,0) : 0;
  const nextCn = nxt ? nxt.course : "—";
  const nextWhen = nxt ? nxt.when : "";
  const cards = [
    {num: DATA.courses.length, lab:"课程总数", sub:"含 LIVE/ELP/CARE EN"},
    {num: DATA.courses.reduce((a,c)=>a+c.credit,0), lab:"总学分", sub:"M1 8 + M2 5 + 跨模块 6"},
    {num: weekCnt, lab:"本周课时", sub: curWeek? ("Week " + curWeek) : "未开学"},
    {num: nextCn, lab:"下一节课", sub: nextWhen, cls:"c-next"},
    {num: DATA.exams.length, lab:"已排考试", sub:"FAC · EAF · TPM"},
  ];
  document.getElementById("cards").innerHTML = cards.map(c=>
    `<div class="card"><div class="num ${c.cls||''}" ${c.num.length>6?'style="font-size:18px"':''}>${c.num}</div><div class="lab">${c.lab}</div><div class="sub">${c.sub}</div></div>`).join("");
}

function buildWeekTabs(){
  const today = new Date().toISOString().slice(0,10);
  const el = document.getElementById("weektabs");
  el.innerHTML = DATA.weeks.map(w=>{
    const hol = DATA.holidays.some(h=>h.weeks.includes(w.no));
    const isToday = w.start <= today && today <= w.end;
    return `<button class="wt ${hol?'holiday':''} ${isToday?'today':''}" data-w="${w.no}">
      W${w.no}<span class="wkdates">${w.start.slice(5)}</span></button>`;
  }).join("");
  el.querySelectorAll(".wt").forEach(b=>b.addEventListener("click",()=>selectWeek(+b.dataset.w)));
}

function selectWeek(n){
  document.querySelectorAll(".wt").forEach(b=>b.classList.toggle("active",+b.dataset.w===n));
  const w = DATA.weeks.find(x=>x.no===n);
  const hint = document.getElementById("week-hint");
  hint.textContent = w.start + " ~ " + w.end;
  const info = document.getElementById("weekinfo");
  const tags = [];
  DATA.holidays.filter(h=>h.weeks.includes(n)).forEach(h=>tags.push(`<span class="tag">${h.name} ${h.dates[0]} ~ ${h.dates[1]}</span>`));
  DATA.exams.filter(e=>e.week===n).forEach(e=>tags.push(`<span class="tag exam">${e.course} Exam ${e.date} ${e.time}</span>`));
  info.innerHTML = tags.length? tags.join("") : `<span style="color:var(--dim)">无节假日 / 考试安排</span>`;
  renderGrid(w);
}

function renderGrid(w){
  const today = new Date().toISOString().slice(0,10);
  const holDays = {}; // day -> holiday name
  DATA.holidays.filter(h=>h.weeks.includes(w.no)).forEach(h=>h.days.forEach(d=>holDays[d]=h.name));
  const examDays = {};
  DATA.exams.filter(e=>e.week===w.no).forEach(e=>examDays[e.day]=e);
  let html = `<thead><tr><th>时间</th>` +
    w.days.map((d,i)=>`<th class="${d.date===today?'today':''}">${DAY_CN[i]}<span class="d">${d.date.slice(5)}</span></th>`).join("") +
    `</tr></thead><tbody>`;
  for (let s=0; s<DATA.slots.length; s++){
    html += `<tr><td class="time">${DATA.slots[s].label}</td>`;
    for (let d=0; d<7; d++){
      const sess = w.days[d].sessions.filter(x=>x.s===s);
      if (sess.length){
        const x = sess[0];
        const c = DATA.courses.find(c=>c.code===x.c);
        const isHoliday = holDays[d]!==undefined && x.note;
        const isExam = x.note && x.note.startsWith("Exam");
        const isLive = x.c.startsWith("LIVE");
        const bg = isExam ? "" : `style="border-left-color:${c.color};background:linear-gradient(135deg,${c.color}26,${c.color}0d)"`;
        html += `<td rowspan="${x.n}"><div class="cell ${isExam?'exam':''} ${isLive?'live':''}" ${bg}>
          <span class="cn">${c.cn||c.name}</span>
          ${x.v?`<span class="venue">@ ${x.v}</span>`:""}
          ${x.note?`<span class="note">${x.note}</span>`:""}
          </div></td>`;
      } else if (!w.days[d].sessions.some(x=>x.s<s && x.s+x.n>s)){
        if (holDays[d]!==undefined){
          html += `<td class="cell holiday">${holDays[d]}</td>`;
        } else {
          html += `<td></td>`;
        }
      }
    }
    html += `</tr>`;
  }
  html += `</tbody>`;
  document.getElementById("grid").innerHTML = html;
}

function buildLegend(){
  document.getElementById("legend").innerHTML = DATA.courses.map(c=>
    `<span class="leg"><i style="background:${c.color}"></i>${c.code} ${c.cn}</span>`).join("");
}

function buildCourseTable(){
  const html = `<tr><th>模块</th><th>课程</th><th>缩写</th><th>学分</th><th>教授</th><th>上课地点</th></tr>` +
  DATA.courses.map(c=>{
    const mod = c.module==="M1"?"Module 1":c.module==="M2"?"Module 2":"M1-M2";
    return `<tr>
      <td><span class="mod-tag">${mod}</span></td>
      <td>${c.name}<br><span style="color:var(--dim);font-size:11px">${c.cn}</span></td>
      <td style="font-family:var(--mono);color:${c.color};font-weight:600">${c.code}</td>
      <td class="cr">${c.credit}</td>
      <td>${c.prof}</td>
      <td style="font-family:var(--mono);font-size:11.5px;color:var(--muted)">${c.venues}</td>
    </tr>`;
  }).join("");
  document.getElementById("coursetable").innerHTML = html;
}

function buildExams(){
  document.getElementById("exams").innerHTML =
    `<h2 style="margin-top:0">考试 <span class="hint">EXAMS</span></h2>` +
    DATA.exams.map(e=>`<div class="mini"><div class="t"><span>${e.course} · ${e.cn}</span><span class="d">${e.date}</span></div>
      <div class="s">${e.time}（Week ${e.week} · ${DAY_CN[e.day]}）</div></div>`).join("") +
    `<div class="s" style="color:var(--dim);font-family:var(--mono);font-size:11px;padding:0 2px">MIE / PFV / COF / AIC 考试未排入课表，另行通知</div>`;
}
function buildHolidays(){
  const seen = {};
  DATA.holidays.forEach(h=>{
    const k = h.name + h.dates.join();
    if (!seen[k]) seen[k] = h;
  });
  document.getElementById("holidays").innerHTML =
    `<h2 style="margin-top:0">节假日 <span class="hint">HOLIDAYS</span></h2>` +
    Object.values(seen).map(h=>`<div class="mini"><div class="t"><span>${h.name} ${h.en}</span><span class="d">${h.dates[0]} ~ ${h.dates[1]}</span></div>
      <div class="s">Week ${h.weeks.join(" / ")}</div></div>`).join("");
}

init();
</script>
</body>
</html>
