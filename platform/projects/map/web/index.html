<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 天地图 key 有 Referer 白名单：瓦片请求不带 Referer 才能正常加载 -->
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/template.css">
<link rel="stylesheet" href="assets/leaflet/leaflet.css">
<script src="assets/leaflet/leaflet.js"></script>
<script src="assets/coord.js"></script>
<script src="assets/venues.js"></script>
<title>地点地图 · KittenPuppy4Ever</title>
<style>
  /* 地点地图 · 项目组件：颜色/圆角/字号一律引用 template.css 令牌。
     页面骨架（.page/.section/.section-head/.toolbar/.btn/.chip/.list）由模板提供。 */
  :root { --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace; }

  /* ---------- 区块头里的数据胶囊 ---------- */
  .section-head .chip b { color: var(--accent); font-weight: 650; }

  /* ---------- 底图切换 / 新建地点 ---------- */
  #baselayers .bl {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
  }
  #baselayers .bl:hover { color: var(--ink); border-color: #d9cdb9; }
  #baselayers .bl.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 6px 16px rgba(0, 61, 165, .18);
  }

  /* ---------- 地图 + 地点列表 ---------- */
  .mapgrid { display: grid; grid-template-columns: 1.65fr 1fr; gap: 14px; margin-top: 12px; }
  @media (max-width: 900px) { .mapgrid { grid-template-columns: 1fr; } }
  .mapbox {
    position: relative; isolation: isolate; overflow: hidden;
    border: 1px solid var(--line); border-radius: 12px; background: #f2ecdf;
  }
  #map { width: 100%; height: 60vh; min-height: 400px; }
  .venue-list { max-height: 60vh; min-height: 400px; overflow-y: auto; }

  .vcard {
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    background: #fffdf9; cursor: pointer;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .vcard:hover { border-color: #dccfba; transform: translateY(-1px); }
  .vcard.active { border-color: var(--accent); background: rgba(0, 61, 165, .05); }
  .vcard .n { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 13px; color: var(--ink); }
  .vcard .n .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .vcard .a { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .vcard .c { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 4px; }
  .vcard .apx {
    font-size: 10px; color: var(--muted); border: 1px dashed var(--line);
    border-radius: 4px; padding: 0 5px; margin-left: 6px;
  }

  /* ---------- 地点标记（Leaflet divIcon） ---------- */
  .tdt-pin .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; background: var(--accent);
    border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
  }
  .tdt-pin .pin em { transform: rotate(45deg); font-style: normal; }
  .tdt-pin .pin-tip {
    position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; font-size: 10px; border-radius: 6px;
    padding: 1px 7px; white-space: nowrap; font-family: var(--mono);
  }
  .tdt-pin.gate .pin { background: var(--muted); }
  .tdt-pin.custom .pin, .tdt-pin.pick .pin { background: linear-gradient(135deg, var(--pink), #c96a5a); }

  /* ---------- 地点安排表 ---------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table.arrange-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.arrange-table th, table.arrange-table td {
    padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line);
  }
  table.arrange-table th {
    color: var(--muted); font-weight: 600; font-size: 11px;
    font-family: var(--mono); background: #f2ecdf; letter-spacing: .4px;
  }
  table.arrange-table tr:last-child td { border-bottom: 0; }
  table.arrange-table tr:hover td { background: rgba(0, 61, 165, .04); }
  .codechip {
    display: inline-block; font-family: var(--mono); font-weight: 700; font-size: 11px;
    color: var(--ink); padding: 2px 9px; border-radius: 6px;
  }

  /* ---------- 新建地点编辑器（venues.js 生成的弹窗，沿用其类名） ---------- */
  .modal-back {
    position: fixed; inset: 0; z-index: 70; padding: 18px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(66, 57, 43, .45);
  }
  .modal.modal-lg {
    position: relative; inset: auto; z-index: 1;
    width: min(680px, 94vw); height: min(660px, 88vh);
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px 22px; box-shadow: 0 24px 70px rgba(66, 57, 43, .3);
  }
  .modal-lg h3 { flex: none; margin: 0 0 12px; font-size: 15px; color: var(--ink); }
  .modal-lg #vstage1, .modal-lg #vstage2 { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .modal-lg #vstage2 { overflow-y: auto; }
  .modal-lg .place-row, .modal-lg .modal-btns, .modal-lg label, .modal-lg .vbind-lab { flex: none; }
  .modal-lg .vmapbox { flex: 1; min-height: 120px; }
  .modal-lg .vqres { flex: none; max-height: 230px; overflow-y: auto; }
  .modal-lg .mylist-empty { padding: 6px 0; font-size: 12px; }
  .modal-lg label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .modal-lg input {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px;
    font: inherit; font-size: 13px; background: #fffefb; color: var(--ink);
  }
  .modal-lg input:focus { outline: none; border-color: #a9c3e6; box-shadow: 0 0 0 3px rgba(110, 168, 255, .14); }

  .place-row { display: flex; gap: 8px; margin-top: 4px; }
  .place-row input { flex: 1; min-width: 0; }
  .vmapbox {
    position: relative; margin: 10px 0 8px; isolation: isolate; z-index: 0;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #f2ecdf;
  }
  #vmap { width: 100%; height: 100%; }
  .vmap-tip {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 61, 165, .82); color: #fff; font-size: 11px;
    border-radius: 999px; padding: 2px 12px; pointer-events: none; font-family: var(--mono);
  }
  .vqres {
    margin-top: 8px; max-height: 212px; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 10px; background: #fffdf9;
  }
  .vqtitle { font-size: 11px; color: var(--muted); font-family: var(--mono); padding: 8px 10px 4px; }
  .vqitem { padding: 7px 10px; cursor: pointer; user-select: none; border-top: 1px solid var(--line); }
  .vqitem:first-child { border-top: none; }
  .vqitem:hover { background: rgba(0, 61, 165, .04); }
  .vqitem.selected { background: rgba(0, 61, 165, .08); border-left: 3px solid var(--accent); }
  .vqitem .n { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .vqitem .n i { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--accent); margin-left: 4px; }
  .vqitem .coords { font-family: var(--mono); font-size: 10.5px; color: var(--accent); margin-top: 1px; }
  .vqitem .a {
    font-size: 11px; color: var(--muted); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .vbind-lab { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .vbind {
    border: 1px solid var(--line); border-radius: 10px; background: #fffdf9;
    max-height: 130px; overflow-y: auto; padding: 4px 8px;
  }
  .vbind-item {
    display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink);
    padding: 5px 4px; cursor: pointer; border-top: 1px solid var(--line);
  }
  .vbind-item:first-child { border-top: none; }
  .vbind-item:hover { background: rgba(0, 61, 165, .04); }
  .vbind-item input { width: auto; flex-shrink: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-btns { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  .vconfirm-hint { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
  .btn-primary {
    border: 0; border-radius: 999px; padding: 8px 15px; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 650; background: var(--accent); color: #fff;
    transition: filter .15s, transform .15s;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary:active { transform: scale(.975); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 8px 15px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .btn-ghost:hover { color: var(--ink); border-color: #d9cdb9; }
  .btn-back {
    align-self: flex-start; background: transparent; border: none; color: var(--accent);
    font-size: 13px; cursor: pointer; padding: 0 0 10px; font-weight: 650; font-family: inherit;
  }
  .btn-back:hover { color: var(--pink); }
  .mylist-empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 16px 0; }
</style>
</head>
<body data-project="map">
<main class="page">
  <section class="section">
    <div class="section-head">
      <h2>地点地图</h2>
      <span class="hint" id="map-hint"></span>
      <div class="actions">
        <span class="chip">学期 <b id="term"></b></span>
        <span class="chip">数据更新 <b id="updated"></b></span>
      </div>
    </div>
    <div class="toolbar" id="baselayers">
      <button data-b="vec" class="btn sm bl">🗺 矢量</button>
      <button data-b="img" class="btn sm bl active">🛰 卫星影像</button>
      <span class="spacer"></span>
      <button id="new-venue" class="btn sm primary">➕ 新建地点</button>
    </div>
    <div class="mapgrid">
      <div class="mapbox"><div id="map"></div></div>
      <div class="venue-list"><div id="venue-cards" class="list"></div></div>
    </div>
  </section>

  <section class="section">
    <div id="arrange"></div>
  </section>
</main>

<script>
const DAY_CN = ["周一","周二","周三","周四","周五","周六","周日"];
const DATA_V = "v20260904g";
function fmtMin(m){
  const h = Math.floor(m/60), mm = m%60;
  return String(h).padStart(2,"0") + ":" + String(mm).padStart(2,"0");
}
// 天地图瓦片 key 从 schedule.json 的 meta.tdtKey 读取（可替换为自己的浏览器端 key）
let TDT_KEY = "";
// 兜底底图：高德公开瓦片端点（无需 key，纯国内；仅当天地图在浏览器中加载失败时自动启用）
const AMAP_IMG = "https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}";
const AMAP_VEC = "https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}";
const AMAP_SUB = ["1","2","3","4"];
let provider = "tdt";   // 当前底图服务商：tdt（天地图）| amap（高德兜底）
let DATA = null, mapObj = null, venueData = [], baseLayers = {};
let proxyBase = null;   // 本机天地图瓦片代理（Cloudflare 隧道）地址，来自 tile-proxy.json
let markerLayer = null, pickMarker = null;   // 地点标记层 / 地图选点临时标记
// 个人日程（与主页共用同一个 localStorage key，用于自定义地点的日程统计）
const EVT_KEY = "emf_schedule_events_v1";
function getEvents(){ try { return JSON.parse(localStorage.getItem(EVT_KEY) || "[]"); } catch(e){ return []; } }

async function init(){
  const r = await fetch("schedule.json");
  DATA = await r.json();
  DATA.weeks = deriveSchedule(DATA);
  TDT_KEY = (DATA.meta && DATA.meta.tdtKey) || TDT_KEY;
  document.getElementById("term").textContent =
    DATA.meta.termStart.slice(5).replace("-","/") + " ~ " + DATA.meta.termEnd.slice(5).replace("-","/");
  document.getElementById("updated").textContent = DATA.meta.updated;
  // 本机瓦片代理（隧道）地址：由 tdt_tunnel.py 更新（大论文管线同款模式）
  try {
    const pr = await fetch("tile-proxy.json?ts=" + Date.now(), {cache:"no-store"});
    if (pr.ok){
      const pj = await pr.json();
      if (pj && pj.url) proxyBase = pj.url.replace(/\/+$/, "");
    }
  } catch(e){ proxyBase = null; }
  // key 类型决定首选链路：浏览器端 key → 直连；服务端 key（浏览器 UA 会被 403）→ 优先本机代理
  const keyType = (DATA.meta && DATA.meta.tdtKeyType) || "server";
  provider = (keyType === "browser") ? "tdt" : (proxyBase ? "proxy" : "tdt");
  triedProviders = [];

  // 地点卡片：内置地点 + 自定义地点 + 线上/待定桶（描述按课程数据结构化生成）
  venueData = VenueStore.allVenues().map(v=>({...v, note: venueNote(v), count: countForVenue(v)}));
  venueData.push({code:"", name:"线上 / 待定（LIVE · ELP · CARE EN 等）", short:"线上/待定",
                  address:"无固定教室", note: venueNote({code:""}), count: countForVenue({code:""}),
                  virtual:true});
  buildVenueCards();
  initMap();
  // 支持 ?v=地点 参数：从详情弹窗跳转过来时自动选中对应地点
  let initVenue = venueData[0] ? venueData[0].code : "";
  try {
    const q = new URLSearchParams(location.search).get("v");
    if (q){
      const hit = venueData.find(x=>x.code === q) || venueData.find(x=>x.name === q) || venueData.find(x=>x.short === q);
      if (hit) initVenue = hit.code;
    }
  } catch(e){}
  selectVenue(initVenue);
}

function countForVenue(v){
  let n = 0;
  for (const w of DATA.weeks) for (const d of w.days) for (const s of d.sessions)
    if (s.v === v.code) n++;
  // 自定义地点：加上在该地点举行的个人日程
  if (v.custom) n += getEvents().filter(e=>e.place && e.place === v.name).length;
  return n;
}

/* 地点描述结构化生成（不再硬编码）：
   按课程数据统计主要上课日 + 工作日/周末归类 */
function venueNote(v){
  if (!v.code) return "直播课与英语课等（无固定教室）";
  if (v.ref) return "参考点";
  if (v.custom){
    const evts = getEvents().filter(e=>e.place && e.place === v.name);
    return evts.length ? ("个人日程 " + evts.length + " 条" + (v.note ? " · " + v.note : ""))
                       : "自定义地点" + (v.note ? " · " + v.note : "");
  }
  const dayCnt = [0,0,0,0,0,0,0];
  for (const w of DATA.weeks) for (const d of w.days) for (const s of d.sessions)
    if (s.v === v.code) dayCnt[w.days.indexOf(d)]++;
  const active = dayCnt.map((n,i)=>({n,i})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  if (!active.length) return "暂无课程安排";
  const days = active.map(x=>DAY_CN[x.i]).join("、");
  const weekday = active.filter(x=>x.i<5).length;
  const weekend = active.length - weekday;
  const part = weekend > weekday ? "周末为主" : (weekday > weekend ? "工作日" : "工作日+周末");
  return "主要上课日：" + days + "（" + part + "）";
}

// 瓦片失败仅重试一次（换子域），防止无限重试造成请求风暴
function makeLayer(urlTpl, subs, attribution){
  const layer = L.tileLayer(urlTpl,
    {subdomains: subs, maxZoom: 18, attribution});
  layer.on("tileerror", e => {
    if (e.tile.dataset.retried) return;
    e.tile.dataset.retried = "1";
    setTimeout(()=>{
      const t = urlTpl.includes("{s}")
        ? urlTpl.replace("{s}", subs[Math.floor(Math.random()*subs.length)])
        : urlTpl + (urlTpl.includes("?") ? "&" : "?") + "_=" + Math.floor(Math.random()*1e6);
      const src = t.replace("{x}", e.coords.x).replace("{y}", e.coords.y).replace("{z}", e.coords.z);
      e.tile.src = src;
    }, 800);
  });
  return layer;
}

function initMap(){
  if (mapObj){ mapObj.invalidateSize(); return; }
  const c = DATA.meta.mapCenter || [31.2995, 121.5020];
  mapObj = L.map("map", {center: c, zoom: 16});
  buildBaseLayers();

  // 底图切换按钮（矢量 / 卫星影像）
  document.getElementById("baselayers").querySelectorAll(".bl[data-b]").forEach(b=>{
    b.addEventListener("click", ()=>switchBase(b.dataset.b));
  });

  // 自动兜底：天地图若在浏览器中加载失败，切换高德端点（同是国内服务）
  setTimeout(checkFallback, 7000);

  buildMarkers();
  document.getElementById("map-hint").textContent =
    (provider === "proxy" ? "天地图底图（经本机代理·国内网络拉取）" : "天地图底图") +
    " · 点击标记或右侧卡片查看该地点安排";
}

/* 地图标记：内置 + 自定义地点（描述结构化生成） */
function buildMarkers(){
  if (!mapObj) return;
  if (markerLayer) markerLayer.clearLayers();
  else markerLayer = L.layerGroup().addTo(mapObj);
  VenueStore.allVenues().forEach(v=>{
    if (v.lat === undefined || v.lng === undefined) return;
    const isGate = !!v.ref;
    const isCustom = !!v.custom;
    const icon = L.divIcon({
      className: "tdt-pin" + (isGate ? " gate" : "") + (isCustom ? " custom" : ""),
      html: `<div class="pin"><em>${isGate ? "门" : (isCustom ? "📍" : "🏛")}</em></div><div class="pin-tip">${v.short || v.name}</div>`,
      iconSize: [30, 44], iconAnchor: [15, 42]
    });
    const pop = L.popup().setContent(
      `<b>${v.name}</b><br>${v.address || ""}` +
      (v.approx ? `<br><i style="font-size:11px">坐标近似，可在地图上校正</i>` : "") +
      `<br><span style="font-size:11px;color:#8a7f6d">${venueNote(v)}</span>` +
      `<br><a href="javascript:;" class="pop-sel">查看该地点安排 →</a>`
    );
    L.marker([v.lat, v.lng], {icon}).addTo(markerLayer).bindPopup(pop)
      .on("popupopen", e=>{
        e.popup.getElement().querySelector(".pop-sel").addEventListener("click", ()=>{
          selectVenue(v.code); mapObj.closePopup();
        });
      });
  });
}

function buildBaseLayers(){
  const sub8 = ["0","1","2","3","4","5","6","7"];
  Object.values(baseLayers).forEach(g=>{
    if (g.base && mapObj.hasLayer(g.base)) mapObj.removeLayer(g.base);
    if (g.label && mapObj.hasLayer(g.label)) mapObj.removeLayer(g.label);
  });
  if (provider === "tdt"){
    baseLayers = {
      vec: { base: makeLayer("https://t{s}.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk=" + TDT_KEY, sub8, "© 天地图"),
             label: makeLayer("https://t{s}.tianditu.gov.cn/DataServer?T=cva_w&x={x}&y={y}&l={z}&tk=" + TDT_KEY, sub8, "") },
      img: { base: makeLayer("https://t{s}.tianditu.gov.cn/DataServer?T=img_w&x={x}&y={y}&l={z}&tk=" + TDT_KEY, sub8, "© 天地图"),
             label: makeLayer("https://t{s}.tianditu.gov.cn/DataServer?T=cia_w&x={x}&y={y}&l={z}&tk=" + TDT_KEY, sub8, "") },
    };
  } else if (provider === "proxy" && proxyBase){
    // 本机隧道代理：由国内网络拉取天地图瓦片再回传
    const p = T => proxyBase + "/tdt/" + T + "/{z}/{x}/{y}";
    baseLayers = {
      vec: { base: makeLayer(p("vec_w"), [""], "天地图·本机代理"), label: makeLayer(p("cva_w"), [""], "") },
      img: { base: makeLayer(p("img_w"), [""], "天地图·本机代理"), label: makeLayer(p("cia_w"), [""], "") },
    };
  } else {
    baseLayers = {
      vec: { base: makeLayer(AMAP_VEC, AMAP_SUB, "© 高德"), label: null },
      img: { base: makeLayer(AMAP_IMG, AMAP_SUB, "© 高德"), label: null },
    };
  }
  switchBase(document.querySelector("#baselayers .bl.active")?.dataset.b || "img");
}

const HINTS = {
  tdt: "天地图直连 · 点击标记或右侧卡片查看该地点安排",
  proxy: "天地图（经本机代理·国内网络拉取）· 点击标记或右侧卡片查看该地点安排",
  amap: "已自动切换高德底图（天地图不可达）· 点击标记或右侧卡片查看该地点安排",
};
let triedProviders = [];

function nextProvider(){
  for (const p of ["tdt", "proxy", "amap"]){
    if (p === "proxy" && !proxyBase) continue;
    if (!triedProviders.includes(p)) return p;
  }
  return null;
}

function checkFallback(){
  if (provider === "amap") return;   // 已是最终兜底
  const tiles = [...document.querySelectorAll("#map img.leaflet-tile")];
  let loaded = 0, failed = 0;
  for (const t of tiles){
    if (t.complete && t.naturalWidth > 0) loaded++;
    else if (t.dataset.retried) failed++;
  }
  if (failed >= 5 && loaded <= 3){
    triedProviders.push(provider);
    const next = nextProvider();
    if (!next) return;
    provider = next;
    buildBaseLayers();
    document.getElementById("map-hint").textContent = HINTS[provider];
    setTimeout(checkFallback, 10000);
  }
}

function switchBase(kind){
  if (!mapObj) return;
  Object.values(baseLayers).forEach(g=>{
    if (g.base && mapObj.hasLayer(g.base)) mapObj.removeLayer(g.base);
    if (g.label && mapObj.hasLayer(g.label)) mapObj.removeLayer(g.label);
  });
  const g = baseLayers[kind];
  if (!g) return;
  g.base.addTo(mapObj);
  if (g.label) g.label.addTo(mapObj);
  g.base.bringToBack();
  document.querySelectorAll("#baselayers .bl").forEach(b=>b.classList.toggle("active", b.dataset.b===kind));
}

function buildVenueCards(){
  const el = document.getElementById("venue-cards");
  el.innerHTML = venueData.map(v=>{
    const dotColor = v.virtual ? "#d3c39c" : (v.ref ? "#8a7f6d" : "var(--accent)");
    return `<div class="vcard" data-code="${v.code}">
      <div class="n"><span class="dot" style="background:${dotColor}"></span>${v.short}${v.approx?'<span class="apx">坐标近似</span>':""}</div>
      <div class="a">${v.address}</div>
      <div class="c">安排 ${v.count} 节 ${v.note?("· "+v.note):""}</div>
    </div>`;
  }).join("");
  el.querySelectorAll(".vcard").forEach(c=>c.addEventListener("click",()=>selectVenue(c.dataset.code)));
}

function selectVenue(code){
  const v = venueData.find(x=>x.code===code);
  if (!v) return;
  document.querySelectorAll(".vcard").forEach(c=>c.classList.toggle("active", c.dataset.code===code));
  renderArrange(v);
  if (!v.virtual && v.lat !== undefined && mapObj){
    // 保持 15 级：避免缩放大批量并发请求触发天地图免费 key 的并发限制
    mapObj.setView([v.lat, v.lng], 15, {animate: true});
  }
}

function renderArrange(v){
  const rows = [];
  for (const w of DATA.weeks) for (const d of w.days) for (const s of d.sessions){
    if (s.v === v.code){
      const c = DATA.courses.find(x=>x.code===s.c);
      rows.push({
        date: d.date, wk: w.no, day: DAY_CN[w.days.indexOf(d)],
        time: fmtMin(s.start) + "~" + fmtMin(s.end),
        course: (c ? c.cn : "") + (s.note ? " " + s.note : ""),
        color: c ? c.color : "#d3c39c"
      });
    }
  }
  // 自定义地点：列出在该地点举行的个人日程
  if (v.custom){
    for (const e of getEvents()){
      if (e.place && e.place === v.name){
        const wk = Math.max(1, Math.min(DATA.meta.totalWeeks,
          Math.floor((new Date(e.date + "T00:00:00+08:00") - new Date(DATA.meta.termStart + "T00:00:00+08:00")) / (7*864e5)) + 1));
        rows.push({
          date: e.date, wk, day: "个人日程",
          time: fmtMin(e.startMin) + "~" + fmtMin(e.endMin),
          course: "📌 " + e.title + (e.note ? " · " + e.note : ""),
          color: "#ec9fbe"
        });
      }
    }
  }
  rows.sort((a,b)=>a.date<b.date?-1:1);
  const el = document.getElementById("arrange");
  el.innerHTML = `<div class="section-head"><h2>${v.short} · 安排（${rows.length} 节）</h2></div>` + (rows.length ?
    `<div class="table-wrap"><table class="arrange-table">
       <tr><th>日期</th><th>时间</th><th>内容</th></tr>` +
    rows.map(r=>`<tr>
      <td style="font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap">${r.date}（W${r.wk} ${r.day}）</td>
      <td style="font-family:var(--mono);font-size:11.5px;white-space:nowrap">${r.time}</td>
      <td><span class="codechip" style="background:${r.color}">${r.course}</span></td>
    </tr>`).join("") + `</table></div>` :
    `<div class="empty">该地点暂无安排</div>`);
}

/* 新建地点：统一组件（搜索栏 / 矢量小地图 / 备选结果 / 日程绑定 / 备注）——见 assets/venues.js */
function refreshVenueUI(){
  venueData = VenueStore.allVenues().map(v=>({...v, note: venueNote(v), count: countForVenue(v)}));
  venueData.push({code:"", name:"线上 / 待定（LIVE · ELP · CARE EN 等）", short:"线上/待定",
                  address:"无固定教室", note: venueNote({code:""}), count: countForVenue({code:""}), virtual:true});
  buildVenueCards();
  buildMarkers();
}
document.getElementById("new-venue").addEventListener("click", function(){
  VenueEditor.open({onSaved: function(v){
    refreshVenueUI();
    selectVenue(v.code);
  }});
});

init();
</script>
