<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏中心 · KittenPuppy4Ever</title>
<link rel="stylesheet" href="/static/template.css">
<style>
  .game-center-page { padding:0; max-width:none; min-height:100vh; }
  .game-center-page .home-wrap { padding:26px 28px 40px; }
  .game-center-page .hello { margin:4px 2px 16px; }
  .stats-panel { transition: opacity .2s, transform .2s; }
  .stats-panel.hidden { display:none; }
  .stat-line { display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px dashed var(--line); font-size:12px; }
  .stat-line:last-child { border-bottom:0; }
  .stat-line .t { flex:1; color:var(--ink); }
  .stat-line .s { color:var(--muted); font-size:11px; }
  .stat-big { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:10px; }
  .stat-big .n { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#fffefb; }
  .stat-big .n b { display:block; font-size:22px; color:var(--accent); }
  .stat-big .n span { font-size:10.5px; color:var(--muted); }
  @media (max-width:760px) {
    .game-head-actions .btn { padding-left:9px; padding-right:9px; }
    .stat-big { grid-template-columns:repeat(3,minmax(0,1fr)); }
  }
</style>
</head>
<body data-project="games">
<main class="page game-center-page">
  <div id="content" class="home-wrap" data-template="directory-list">
    <div class="hello" id="hello">游戏中心 · 选一个游戏开始</div>
    <div class="home-tools">
      <div class="home-search-wrap">
        <span class="home-search-icon">⌕</span>
        <input id="q" type="search" placeholder="搜索游戏…" autocomplete="off">
        <button class="home-search-clear" id="clear" type="button" aria-label="清空">×</button>
      </div>
      <div class="home-tags" id="tags"></div>
      <div class="directory-meta">
        <span class="home-count" id="count">正在加载…</span>
        <button class="btn soft sm" id="refresh" type="button">刷新</button>
      </div>
    </div>
    <div class="cards" id="cards"></div>
    <section class="section stats-panel hidden" id="stats-panel">
      <div class="section-head">
        <h2>游戏中心统计</h2>
        <span class="hint">来自目录树的实时结构统计</span>
        <div class="actions"><button class="btn soft sm" id="stats-close" type="button">收起</button></div>
      </div>
      <div class="stat-big" id="stat-big"></div>
      <div id="stat-list"></div>
    </section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
let games = null, q = "", tag = "";

async function api(path) {
  const r = await fetch(path, {headers: {"Accept": "application/json"}, cache: "no-store"});
  let j = null;
  try { j = await r.json(); } catch (e) {}
  if (!r.ok || !j || !j.ok) throw new Error((j && j.error && j.error.message) || ("HTTP " + r.status));
  return j;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function findNode(node, id) {
  if (!node) return null;
  if (node.id === id) return node;
  for (const c of node.children || []) {
    const hit = findNode(c, id);
    if (hit) return hit;
  }
  return null;
}
function go(path) {
  if (window.parent !== window) {
    try { window.parent.postMessage({kpNavigate: path}, "*"); return; } catch (e) {}
  }
  location.href = path;
}
function visibleChildren(node) {
  return (node && node.children || []).filter((n) => !n.hidden && n.path);
}
function render() {
  const kids = visibleChildren(games);
  const tags = [];
  for (const n of kids) for (const t of (n.tags || [])) if (!tags.includes(t)) tags.push(t);
  const tagBox = $("#tags");
  tagBox.innerHTML = '<button class="home-tag' + (!tag ? " active" : "") + '" data-tag="">全部</button>' +
    tags.map((t) => '<button class="home-tag' + (tag === t ? " active" : "") + '" data-tag="' + esc(t) + '">' + esc(t) + "</button>").join("");
  tagBox.querySelectorAll(".home-tag").forEach((b) => {
    b.onclick = () => { tag = b.dataset.tag || ""; render(); };
  });
  const query = q.trim().toLowerCase();
  const list = kids.filter((n) => {
    if (tag && !(n.tags || []).includes(tag)) return false;
    if (!query) return true;
    return [n.title, n.desc, (n.tags || []).join(" ")].join(" ").toLowerCase().includes(query);
  });
  $("#count").textContent = list.length + " 个游戏" + (tag ? " · 标签：" + tag : "") + (query ? " · 搜索：" + q.trim() : "");
  const box = $("#cards");
  box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = '<div class="empty" style="grid-column:1/-1">没有匹配的游戏</div>';
  }
  list.forEach((n, i) => {
    const card = document.createElement("article");
    card.className = "card";
    card.style.animationDelay = (60 * i) + "ms";
    const accent = (n.ui && n.ui.theme && n.ui.theme.accent) || "#9bd1ec";
    card.style.setProperty("--wc", accent);
    card.innerHTML =
      '<span class="ico">' + esc(n.icon || "🎮") + "</span>" +
      "<h2>" + esc(n.title) + "</h2>" +
      "<p>" + esc(n.desc || "") + "</p>" +
      ((n.tags || []).length ? '<div class="card-tags">' + n.tags.map((t) => "<span>" + esc(t) + "</span>").join("") + "</div>" : "") +
      '<div class="foot"><span class="go">开始</span><span class="sub-chips">' +
      visibleChildren(n).map((k) => '<span class="sub-chip">' + esc(k.icon || "") + " " + esc(k.title) + "</span>").join("") +
      "</span></div>";
    card.onclick = () => go(n.path);
    box.appendChild(card);
  });
}
function renderStats() {
  const kids = visibleChildren(games);
  const tags = new Set();
  for (const n of kids) for (const t of (n.tags || [])) tags.add(t);
  $("#stat-big").innerHTML =
    '<div class="n"><b>' + kids.length + "</b><span>游戏数量</span></div>" +
    '<div class="n"><b>' + tags.size + "</b><span>标签数量</span></div>" +
    '<div class="n"><b>' + kids.filter((n) => (n.children || []).some((c) => c.path)).length + "</b><span>含子页面</span></div>";
  $("#stat-list").innerHTML = kids.length ? kids.map((n, i) =>
    '<div class="stat-line"><span class="s">' + String(i + 1).padStart(2, "0") + "</span>" +
    '<span class="t">' + esc(n.icon || "🎮") + " " + esc(n.title) + "</span>" +
    '<span class="s">' + esc(n.path) + "</span></div>").join("") : '<div class="empty">暂无游戏</div>';
}
async function load() {
  try {
    const j = await api("/api/tree");
    games = findNode(j.root, "games");
    if (!games) throw new Error("目录树里没有 games 节点");
    render(); renderStats();
  } catch (e) {
    $("#count").textContent = "加载失败：" + e.message;
    $("#cards").innerHTML = '<div class="empty" style="grid-column:1/-1">' + esc(e.message) + "</div>";
  }
}
$("#q").addEventListener("input", (e) => {
  q = e.target.value || "";
  document.querySelector(".home-search-wrap").classList.toggle("has-query", !!q);
  render();
});
$("#clear").onclick = () => { q = ""; $("#q").value = ""; document.querySelector(".home-search-wrap").classList.remove("has-query"); render(); $("#q").focus(); };
$("#refresh").onclick = load;
function toggleStats(force) {
  const panel = $("#stats-panel");
  if (!panel) return;
  const show = force === undefined ? panel.classList.contains("hidden") : !!force;
  panel.classList.toggle("hidden", !show);
  if (show) {
    renderStats();
    panel.scrollIntoView({behavior: "smooth", block: "start"});
  }
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.kpGameStats) toggleStats();
});
$("#stats-close").onclick = () => toggleStats(false);
load();
</script>
</body>
</html>
