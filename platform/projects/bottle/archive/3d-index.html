<script>
const API = "/api/p/bottle";
let rev = 0, bottles = [], me = "", people = [], birthday = "";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (v) => v ? new Date(v.length === 10 ? v + "T00:00:00" : v).toLocaleDateString("zh-CN") : "—";
const nameOf = (u) => { const p = people.find(x => x.user === u); return (p && p.emoji ? p.emoji + " " : "") + (u || "—"); };

async function call(url, opts) {
  const r = await fetch(url, Object.assign({ cache: "no-store" }, opts || {}));
  const j = await r.json().catch(() => ({ ok:false, error:{message:"非 JSON"} }));
  if (!j.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  return j;
}

function localDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function nextBirthday() {
  const d = new Date();
  let md = "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(birthday)) md = birthday.slice(5);
  else if (/^\d{2}-\d{2}$/.test(birthday)) md = birthday;
  if (!md) { const x = new Date(d); x.setFullYear(x.getFullYear() + 1); return localDate(x); }
  let y = d.getFullYear();
  let x = new Date(y + "-" + md + "T00:00:00");
  if (x <= d) x = new Date((y + 1) + "-" + md + "T00:00:00");
  return localDate(x);
}

function themeColor(u) {
  const p = people.find(x => x.user === u);
  return (p && p.color) || "#9bd1ec";
}
function bottleSvg(color) {
  const c = esc(color || "#8fb3e8");
  return '<svg class="modal-bottle" viewBox="0 0 120 190" aria-hidden="true" style="--boat:' + c + '">' +
    '<defs><linearGradient id="bgU" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset=".55" stop-color="' + c + '" stop-opacity=".28"/><stop offset="1" stop-color="#dff8ff" stop-opacity=".62"/></linearGradient></defs>' +
    '<ellipse cx="60" cy="173" rx="34" ry="7" fill="#0b3541" opacity=".16"/>' +
    '<path d="M45 25 L45 45 Q30 60 30 88 L30 145 Q30 164 60 164 Q90 164 90 145 L90 88 Q90 60 75 45 L75 25 Z" fill="url(#bgU)" stroke="#f4ffff" stroke-width="2" opacity=".9"/>' +
    '<path d="M48 20 L48 39 L72 39 L72 20 Z" fill="#fff8e8" stroke="#f4ffff" stroke-width="2"/>' +
    '<path d="M45 20 L75 20 L75 12 Q60 6 45 12 Z" fill="#b7895f" stroke="#8f6847" stroke-width="1.5"/>' +
    '<path d="M37 88 L83 88 L83 107 L37 107 Z" fill="' + c + '" opacity=".78"/>' +
    '<path d="M53 96 L67 96 L67 151 L53 151 Z" fill="#fff0c9" stroke="#dbc894" stroke-width="1"/>' +
    '<path d="M56 116 Q60 113 64 116 M56 124 Q60 121 64 124 M56 132 Q60 129 64 132 M56 140 Q60 137 64 140" fill="none" stroke="#c3a96f" stroke-width="1.4" opacity=".8"/>' +
    '<path d="M34 143 Q60 151 86 143" fill="none" stroke="#dffbff" stroke-width="2" opacity=".8"/>' +
    '</svg>';
}
function boat3d(color) {
  return '<div class="pb3d" style="--boat:' + esc(color || "#9bd1ec") + '">' +
    '<div class="pb-face pb-shadow"></div>' +
    '<div class="pb-face pb-hull-l"></div>' +
    '<div class="pb-face pb-hull-r"></div>' +
    '<div class="pb-face pb-bottom"></div>' +
    '<div class="pb-face pb-deck"></div>' +
    '<div class="pb-face pb-bow"></div>' +
    '<div class="pb-face pb-stern"></div>' +
    '<div class="pb-face pb-sail-l"></div>' +
    '<div class="pb-face pb-sail-r"></div>' +
    '<div class="pb-mast"></div>' +
    '<div class="pb-flag"></div>' +
    '</div>';
}
function boatUnit(b, i, n) {
  const color = themeColor(b.from) || b.color || "#9bd1ec";
  let status = "";
  if (b.canOpen) status = '<span class="bt-status openable">可以打开</span>';
  else if (b.isRecipient) status = '<span class="bt-status waiting">等待开启</span>';
  else if (b.isMine) status = '<span class="bt-status mine">你写的</span>';
  else status = '<span class="bt-status notmine">不是给你的</span>';
  const col = i % 5, row = Math.floor(i / 5);
  const rows = Math.max(1, Math.ceil((n || 1) / 5));
  const left = 12 + col * 16 + (row % 2) * 4 + ((i * 13) % 4);
  const top = 38 + row * (40 / rows) + ((i * 17) % 3);
  const bob = (5.2 + (i % 5) * 0.8).toFixed(1);
  const delay = (-(i * 1.3) % 5).toFixed(1);
  return '<div class="bt-boat-unit" tabindex="0" data-bid="' + esc(b.id) + '" style="left:' + left + '%;top:' + top + '%;--boat:' + esc(color) + ';--bob:' + bob + 's;--bob-delay:' + delay + 's;z-index:' + (20 - i) + '">' +
    '<button class="bt-boat-btn" aria-label="来自 ' + esc(b.from) + ' 给 ' + esc(b.to) + ' 的漂流瓶">' + boat3d(color) + '</button>' +
    '</div>';
}
function render() {
  const pool = bottles.filter(b => !b.opened);
  const archive = bottles.filter(b => b.opened && (b.isMine || b.isRecipient));
  renderSea(pool);
  $("#archive").innerHTML = archive.map(b => (
    '<article class="bt-letter" style="--boat:' + esc(themeColor(b.from) || b.color || "#8dbb9a") + '">' +
    '<div class="who">' + esc(nameOf(b.from)) + ' → ' + esc(nameOf(b.to)) + ' · 开启日 ' + esc(fmt(b.openAt)) + '</div>' +
    '<div class="body">' + esc(b.message || "（内容不可见）") + '</div>' +
    '<div class="when">打开于 ' + esc(fmt(b.openedAt)) + '</div></article>'
  )).join("");
  $("#archive-empty").style.display = archive.length ? "none" : "";
  $("#pool-chip").textContent = pool.length + " 个未打开";
  $("#archive-chip").textContent = archive.length + " 个已打开";
  $("#rev").textContent = "rev " + rev;
}
let popHideTimer = null;
function popupHtml(b) {
  let status = "", action = "";
  if (b.canOpen) { status = '<span class="bt-status openable">可以打开</span>'; action = '<button class="btn primary sm" data-pop-open="' + esc(b.id) + '">打开瓶子</button>'; }
  else if (b.isRecipient) { status = '<span class="bt-status waiting">等待开启</span>'; action = '<span class="bt-locked">' + esc(fmt(b.openAt)) + ' 开启</span>'; }
  else if (b.isMine) { status = '<span class="bt-status mine">你写的</span>'; action = '<span class="bt-locked">等对方打开</span>'; }
  else { status = '<span class="bt-status notmine">不是给你的</span>'; action = '<span class="bt-locked">不可打开</span>'; }
  return '<div class="bt-line"><span>' + esc(nameOf(b.from)) + '</span><span class="arrow">→</span><span>' + esc(nameOf(b.to)) + '</span>' + status + '</div>' +
    '<div class="bt-meta">封存 ' + esc(fmt(b.createdAt)) + '<br>开启 ' + esc(fmt(b.openAt)) + '</div>' +
    '<div class="bt-actions">' + action + '</div>';
}
function showBoatPopAt(b, sx, sy) {
  if (popHideTimer) { clearTimeout(popHideTimer); popHideTimer = null; }
  const pop = $("#boat-pop");
  if (!pop || !b) return;
  pop.innerHTML = popupHtml(b);
  pop.classList.add("show");
  const pw = 250, ph = pop.offsetHeight || 100;
  let left = Math.max(12, Math.min(innerWidth - pw - 12, sx - pw / 2));
  let top = sy > ph + 24 ? sy - ph - 12 : sy + 20;
  top = Math.max(12, Math.min(innerHeight - ph - 12, top));
  pop.style.left = left + "px"; pop.style.top = top + "px";
  const ob = pop.querySelector("[data-pop-open]");
  if (ob) ob.onclick = () => { hideBoatPop(); openBottle(ob.dataset.popOpen); };
}
function hideBoatPop() {
  const pop = $("#boat-pop");
  if (pop) pop.classList.remove("show");
}
function scheduleHidePop() {
  if (popHideTimer) clearTimeout(popHideTimer);
  popHideTimer = setTimeout(hideBoatPop, 140);
}
const popEl = $("#boat-pop");
if (popEl) {
  popEl.addEventListener("mouseenter", () => { if (popHideTimer) { clearTimeout(popHideTimer); popHideTimer = null; } });
  popEl.addEventListener("mouseleave", scheduleHidePop);
}
window.addEventListener("scroll", hideBoatPop, true);
window.addEventListener("resize", () => { hideBoatPop(); if (sea3d) sea3d.resize(); });

/* ---- Three.js sea / paper boats ---- */
let sea3d = null;
const WATER_Y = -0.27;
const WAVES = [
  { dx: .93, dz: .37, amp: .11, freq: 1.15, speed: 1.05 },
  { dx: -.52, dz: .85, amp: .075, freq: 1.85, speed: 1.35 },
  { dx: .31, dz: -.95, amp: .055, freq: 2.65, speed: 1.65 }
];
function waveAt(x, z, t) {
  let y = 0, nx = 0, nz = 0;
  for (const w of WAVES) {
    const ph = (x * w.dx + z * w.dz) * w.freq - t * w.speed;
    y += w.amp * Math.sin(ph);
    const c = w.amp * w.freq * Math.cos(ph);
    nx += w.dx * c; nz += w.dz * c;
  }
  return { y, nx, nz };
}
function initSea3d() {
  if (sea3d || !window.THREE) return sea3d;
  const glCanvas = $("#sea-canvas"), rayCanvas = $("#ray-canvas"), sea = $("#sea");
  if (!glCanvas || !sea) return null;
  const canvas = rayCanvas || glCanvas;
  const renderer = new THREE.WebGLRenderer({canvas: glCanvas, alpha:true, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  const scene = new THREE.Scene();
  // Procedural sky environment: gives the glass actual reflections/highlights
  // without depending on an external HDRI.
  const envCanvas = document.createElement("canvas");
  envCanvas.width = 512; envCanvas.height = 256;
  const eg = envCanvas.getContext("2d");
  const envGrad = eg.createLinearGradient(0, 0, 0, 256);
  envGrad.addColorStop(0, "#dff6ff"); envGrad.addColorStop(.46, "#a8d7df");
  envGrad.addColorStop(.55, "#3d8498"); envGrad.addColorStop(1, "#123f50");
  eg.fillStyle = envGrad; eg.fillRect(0, 0, 512, 256);
  const sunGlow = eg.createRadialGradient(120, 74, 2, 120, 74, 54);
  sunGlow.addColorStop(0, "rgba(255,246,205,1)"); sunGlow.addColorStop(1, "rgba(255,246,205,0)");
  eg.fillStyle = sunGlow; eg.fillRect(0, 0, 512, 256);
  const envTex = new THREE.CanvasTexture(envCanvas);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromEquirectangular(envTex).texture;
  pmrem.dispose(); envTex.dispose();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 90);

  // 固定平行光：位置固定，方向固定；阴影/高光都由它计算。
  const lightDir = new THREE.Vector3(-0.55, 0.72, 0.42).normalize();
  scene.add(new THREE.HemisphereLight(0xe8faff, 0x245b68, 1.35));
  scene.add(new THREE.AmbientLight(0xffffff, .38));
  const sun = new THREE.DirectionalLight(0xfff0cf, 2.7);
  sun.position.copy(lightDir).multiplyScalar(22);
  sun.target.position.set(0, 0, 0); scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
  sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 50;
  sun.shadow.bias = -0.0004;
  scene.add(sun);

  // 天空穹顶：和水面分开渲染，地平线来自天空与圆盘水面的交界。
  const skyGeo = new THREE.SphereGeometry(45, 36, 20);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uSun: { value: lightDir.clone() } },
    vertexShader: 'varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vDir; uniform vec3 uSun; void main(){ float h=clamp(vDir.y*1.15+.04,0.0,1.0); vec3 col=mix(vec3(.80,.91,.91),vec3(.25,.55,.69),pow(h,.7)); float sd=max(dot(normalize(vDir),uSun),0.0); col+=vec3(1.0,.83,.48)*pow(sd,220.0)*1.2; col+=vec3(1.0,.88,.62)*pow(sd,16.0)*.08; gl_FragColor=vec4(col,1.0); }'
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // 固定半径的圆形水盘：Gerstner 波模型；CPU 用同一组波参数驱动船的浮力。
  const waveCode = WAVES.map(w => {
    const dx=w.dx.toFixed(3), dz=w.dz.toFixed(3), amp=w.amp.toFixed(3), freq=w.freq.toFixed(3), speed=w.speed.toFixed(3);
    return `{ float ph=(p.x*${dx}+p.z*${dz})*${freq} - uTime*${speed}; y += ${amp}*sin(ph); grad += vec2(${dx},${dz})*${amp*freq}*cos(ph); }`;
  }).join("\n    ");
  const waterVertex = `uniform float uTime; varying vec3 vWorld; varying vec3 vNormal;
    void main(){
      vec3 p=position; float y=0.0; vec2 grad=vec2(0.0);
      ${waveCode}
      p.y += y;
      vWorld=(modelMatrix*vec4(p,1.0)).xyz;
      vNormal=normalize(mat3(modelMatrix)*vec3(-grad.x,1.0,-grad.y));
      gl_Position=projectionMatrix*viewMatrix*vec4(vWorld,1.0);
    }`;
  const waterFragment = `uniform float uTime; uniform vec3 uLightDir; uniform int uBoatCount; uniform vec3 uBoats[12];
    varying vec3 vWorld; varying vec3 vNormal;
    void main(){
      float r=length(vWorld.xz); float edge=1.0-smoothstep(14.0,21.0,r);
      vec3 N=normalize(vNormal + vec3(sin(vWorld.x*3.7+uTime*.9)*.035,0.0,sin(vWorld.z*4.3-uTime*.7)*.035));
      vec3 V=normalize(cameraPosition-vWorld);
      vec3 H=normalize(uLightDir+V);
      float fres=pow(1.0-max(dot(N,V),0.0),3.0);
      float spec=pow(max(dot(N,H),0.0),120.0)*2.2;
      float spec2=pow(max(dot(normalize(N+vec3(.16,0.0,-.11)),H),0.0),42.0)*.35;
      float sunPath=pow(max(dot(reflect(-V,N),uLightDir),0.0),180.0)*2.4;
      vec3 deep=vec3(.018,.14,.23), shallow=vec3(.16,.60,.66);
      vec3 col=mix(deep,shallow,smoothstep(0.0,12.0,r)*.62+.12);
      col=mix(col,vec3(.42,.72,.80),fres*.48);
      float rip=sin(r*5.4-uTime*1.2)*.5+.5; col+=vec3(.10,.22,.23)*rip*.22;
      vec2 cell=floor(vWorld.xz*17.0); float hs=fract(sin(dot(cell+floor(uTime*.9),vec2(12.9898,78.233)))*43758.5453);
      float sp=step(.994,hs)*.55; col+=vec3(.78,.94,.90)*sp;
      float shadow=1.0;
      for(int i=0;i<12;i++){ if(i>=uBoatCount) break; vec3 oc=uBoats[i]-vWorld; float t=dot(oc,uLightDir); if(t>0.0){ vec3 q=vWorld+uLightDir*t; float d=distance(q,uBoats[i]); shadow=min(shadow,smoothstep(.20,.64,d)); } }
      col*=mix(.72,1.0,shadow);
      col+=vec3(1.0,.92,.68)*(spec+spec2+sunPath);
      gl_FragColor=vec4(col,edge*(.74+.20*fres));
    }`;
  const waterGeo = new THREE.CircleGeometry(22, 180);
  waterGeo.rotateX(-Math.PI / 2);
  const waterMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { uTime: { value: 0 }, uLightDir: { value: lightDir.clone() }, uBoatCount: { value: 0 }, uBoats: { value: Array.from({length:12}, () => new THREE.Vector3(999,999,999)) } },
    vertexShader: waterVertex,
    fragmentShader: waterFragment
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.position.y = WATER_Y; water.receiveShadow = true; scene.add(water);
  const boats = new THREE.Group(); scene.add(boats);

function renderSea(pool) {

}
async function load() {
  const j = await call(API + "/state");
  rev = j.rev; bottles = (j.data && j.data.bottles) || [];
  render();
}

function fillRecipients() {
  const sel = $("#c-to");
  sel.innerHTML = people.map(p => '<option value="' + esc(p.user) + '">' + esc((p.emoji || "👤") + " " + p.user) + '</option>').join("");
  if (people.some(p => p.user === me)) sel.value = me;
}

function openCompose(quick) {
  fillRecipients();
  $("#c-open").value = quick ? nextBirthday() : nextBirthday();
  $("#c-message").value = "";
  $("#c-msg").textContent = quick ? "这是给未来自己的生日愿望；到明年生日当天才能打开。" : "";
  $("#compose-modal").classList.add("show");
  setTimeout(() => $("#c-message").focus(), 80);
}

async function saveCompose() {
  const to = $("#c-to").value;
  const openAt = $("#c-open").value;
  const message = $("#c-message").value.trim();
  if (!message) { $("#c-msg").textContent = "写点什么再封进瓶子吧。"; return; }
  $("#c-save").disabled = true;
  try {
    const j = await call(API + "/action", { method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"create", rev:rev, payload:{to:to, openAt:openAt, message:message}}) });
    rev = j.rev; bottles = (j.data && j.data.bottles) || [];
    $("#compose-modal").classList.remove("show"); render();
  } catch(e) { $("#c-msg").textContent = "封存失败：" + e.message; }
  finally { $("#c-save").disabled = false; }
}

async function openBottle(id) {
  hideBoatPop();
  const b = bottles.find(x => x.id === id);
  if (!b) return;
  try {
    const j = await call(API + "/action", { method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"open", rev:rev, payload:{id:id}}) });
    rev = j.rev; bottles = (j.data && j.data.bottles) || [];
    const opened = bottles.find(x => x.id === id) || b;
    const openColor = themeColor(opened.from) || opened.color || "#9bd1ec";
    $("#o-title").textContent = "来自 " + nameOf(opened.from) + " 的漂流瓶";
    $("#o-sub").textContent = "开启日 " + fmt(opened.openAt);
    const ob = $("#o-boat");
    if (ob) ob.innerHTML = bottleSvg(openColor);
    $("#o-message").textContent = opened.message || "";
    $("#o-meta").textContent = "打开于 " + fmt(opened.openedAt);
    $("#open-modal").classList.add("show");
    render();
  } catch(e) { alert(e.message); }
}

async function boot() {
  try {
    if (!window.CANNON) {
      try { window.CANNON = await import("/static/cannon-es.js"); } catch(e) { console.warn("cannon unavailable", e); }
    }
    const s = await call("/api/session");
    me = (s.session && s.session.user) || "";
    const who = $("#who"); if (who) who.textContent = me ? "你是 " + nameOf(me) : "未登录";
    const u = await call("/api/users/public"); people = (u.users || []);
    const b = await call("/api/birthday"); birthday = b.birthday || "";
    await load();
    const quick = sessionStorage.getItem("kp_bottle_birthday") === "1";
    sessionStorage.removeItem("kp_bottle_birthday");
    if (quick) openCompose(true);
  } catch(e) {
    $("#pool-empty").style.display = ""; $("#pool-empty").textContent = "加载失败：" + e.message;
  }
}
$("#compose").onclick = () => openCompose(false);
$("#refresh").onclick = () => load().catch(e => alert(e.message));
$("#c-cancel").onclick = () => $("#compose-modal").classList.remove("show");
$("#c-save").onclick = () => saveCompose();
$("#o-close").onclick = () => { $("#open-modal").classList.remove("show"); };
$("#compose-modal").onclick = (e) => { if (e.target === $("#compose-modal")) $("#compose-modal").classList.remove("show"); };
$("#open-modal").onclick = (e) => { if (e.target === $("#open-modal")) $("#open-modal").classList.remove("show"); };
boot();
