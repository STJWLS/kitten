  .hero-panel { margin-top:14px; padding:12px 14px; border-radius:16px; background:rgba(8,22,17,.82); border:1px solid rgba(231,210,168,.22); color:#e8f0e6; }

  /* viewport-fit: no page scrolling; only internal log / achievement list scrolls */

<script>
/* UI controller is kept separate from the rules engine and AI policy. */
(() => {
  const $ = (s) => document.querySelector(s);
  let game = null;
  let AI_DELAY = 650;
  let ACHIEVEMENTS = [];
  let ACH_STATE = {};
  let ACH_PENDING = [];
  let selectedChips = [];
  let ACH_HELL_IN_HAND = false;
  let ACH_STREAK = 0;
  let ACH_HAND_START_STACK = 0;
  const ACH_TIER = { easy: "简单", medium: "中等", hard: "困难", hell: "极限" };
  const ACH_KEY = () => "kp_achievements_" + (localStorage.getItem("kp_login_user") || "guest");
  function loadAchState() {
    try { ACH_STATE = JSON.parse(localStorage.getItem(ACH_KEY()) || "{}") || {}; } catch (e) { ACH_STATE = {}; }
  }
  function saveAchState() {
    try { localStorage.setItem(ACH_KEY(), JSON.stringify(ACH_STATE)); } catch (e) {}
  }
  function escHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function renderAch() {
    const done = ACHIEVEMENTS.filter((a) => ACH_STATE[a.id]).length;
    const count = document.getElementById("ach-count");
    if (count) count.textContent = done + " / " + ACHIEVEMENTS.length;
    const list = document.getElementById("ach-list");
    if (!list) return;
    list.innerHTML = ACHIEVEMENTS.map((a) => {
      const on = !!ACH_STATE[a.id];
      return '<div class="ach-item' + (on ? "" : " locked") + '"><span class="ico">' + escHtml(a.icon || "🏆") + '</span>' +
        '<span><span class="tt">' + escHtml(a.title) + '</span><span class="dd">' + escHtml(a.desc || "") + '</span></span>' +
        '<span class="tier">' + escHtml(ACH_TIER[a.tier] || "") + '</span></div>';
    }).join("") || '<div class="dd">成就加载中…</div>';
  }
  function achToast(def) {
    if (window.parent !== window) return; // shell handles the Steam toast
    const el = document.getElementById("ach-toast");
    if (!el) return;
    document.getElementById("ach-toast-title").textContent = "成就解锁 · " + def.title;
    document.getElementById("ach-toast-desc").textContent = def.desc || "";
    el.classList.add("show");
    clearTimeout(achToast._t);
    achToast._t = setTimeout(() => el.classList.remove("show"), 3200);
  }
  function unlockAch(id) {
    if (!id) return;
    if (!ACHIEVEMENTS.length) { if (!ACH_PENDING.includes(id)) ACH_PENDING.push(id); return; }
    const def = ACHIEVEMENTS.find((a) => a.id === id);
    if (!def || ACH_STATE[id]) return;
    ACH_STATE[id] = new Date().toISOString();
    saveAchState();
    renderAch();
    achToast(def);
    try {
      if (window.parent !== window) {
        window.parent.postMessage({ kpAchievement: { game: "holdem", id: def.id, title: def.title, desc: def.desc, icon: def.icon } }, "*");
      }
    } catch (e) {}
  }
  async function loadAchievements() {
    loadAchState();
    try {
      const r = await fetch("/api/p/holdem/state", {cache: "no-store"});
      const j = await r.json();
      const arr = j && j.manifest && j.manifest.ui && j.manifest.ui.achievements;
      ACHIEVEMENTS = Array.isArray(arr) ? arr : [];
    } catch (e) { ACHIEVEMENTS = []; }
    ACH_PENDING.forEach((id) => unlockAch(id));
    ACH_PENDING = [];
    renderAch();
  }
  const ACH_CATEGORY = { "一对": "pair", "两对": "two_pair", "三条": "trips", "顺子": "straight", "同花": "flush", "葫芦": "full_house", "四条": "quads", "同花顺": "straight_flush" };
  function onHandStart(info) {
    clearSelected();
    ACH_HAND_START_STACK = Number(info.humanStartStack) || 0;
    ACH_HELL_IN_HAND = !!(game && game.players.some((p) => p.difficulty === "hell"));
    unlockAch("first_hand");
  }
  function onHandResult(r) {
    if (!r) return;
    const human = game && game.players[0];
    const won = Array.isArray(r.winners) && r.winners.includes(0);
    if (r.showdown && !r.humanFolded) {
      unlockAch("first_showdown");
      if (r.humanHand && r.humanHand.name && ACH_CATEGORY[r.humanHand.name]) unlockAch(ACH_CATEGORY[r.humanHand.name]);
    }
    if (!r.humanFolded) unlockAch("no_fold");
    if (won) {
      unlockAch("first_win");
      ACH_STREAK += 1;
      if (ACH_STREAK >= 3) unlockAch("three_streak");
      if (!r.showdown) unlockAch("win_no_showdown");
      if (r.humanBlind === "sb" || r.humanBlind === "bb") unlockAch("blind_win");
      if (r.humanAllIn) unlockAch("all_in_win");
      if (Number(r.pot) >= 500) unlockAch("big_pot");
      if (ACH_HAND_START_STACK > 0 && ACH_HAND_START_STACK < 100) unlockAch("comeback");
      if (ACH_HELL_IN_HAND) unlockAch("hell_slayer");
    } else {
      ACH_STREAK = 0;
    }
  }
  function cardHtml(card, cls) {
    if (!card) return '<span class="card empty ' + (cls || '') + '"></span>';
    const red = card.s === 'h' || card.s === 'd';
    const honor = ({A:'ace', K:'king', Q:'queen', J:'jack'})[card.r] || '';
    return '<span class="card ' + (red ? 'red ' : '') + honor + (honor ? ' ' : '') + (cls || '') + '">' +
      '<span class="rank">' + card.r + '</span><span class="suit">' + (Holdem.SUIT_NAME[card.s] || card.s) + '</span></span>';
  }
  function backCard(cls) { return '<span class="card back ' + (cls || '') + '"></span>'; }
  function fmt(n) { return Number(n || 0).toLocaleString('zh-CN'); }
  const CHIP_SET = [
    { v: 1000, label: "1K", color: "#d8b44e", cap: 2 },
    { v: 500, label: "500", color: "#d8784c", cap: 1 },
    { v: 200, label: "200", color: "#a276c2", cap: 1 },
    { v: 100, label: "100", color: "#34343a", cap: 1 },
    { v: 50, label: "50", color: "#5ca66f", cap: 2 },
    { v: 20, label: "20", color: "#5e9bd8", cap: 2 },
    { v: 10, label: "10", color: "#e9e1d2", cap: 5 },
  ];
  function chipBreakdown(amount) {
    let rem = Math.max(0, Math.floor(Number(amount || 0) / 10) * 10);
    const out = [];
    const add = (v, n) => {
      if (n <= 0) return;
      const c = CHIP_SET.find((x) => x.v === v);
      const hit = out.find((x) => x.v === v);
      if (hit) hit.n += n;
      else out.push({ v, label: c ? c.label : String(v), color: c ? c.color : "#e9e1d2", n });
    };
    // 按 10/20/50/100/200/500/1000 的顺序循环发牌式分配，
    // 让每种面额的数量尽量接近，而不是被大额筹码吞掉。
    const order = [10, 20, 50, 100, 200, 500, 1000];
    while (rem >= 10) {
      let changed = false;
      for (const v of order) {
        if (v > rem) continue;
        add(v, 1);
        rem -= v;
        changed = true;
      }
      if (!changed) break;
    }
    return out.sort((a, b) => b.v - a.v);
  }
  function chipHtml(amount, opts = {}) {
    const parts = chipBreakdown(amount);
    if (!parts.length) return "";
    const max = opts.max || 5;
    const small = opts.small ? " small" : "";
    return parts.slice(0, max).map((c) =>
      '<span class="chip v' + c.v + small + '" title="' + c.v + ' × ' + c.n + '">' + c.label + '</span>' +
      (c.n > 1 ? '<span class="cnt">×' + c.n + '</span>' : '')
    ).join("") + (parts.length > max ? '<span class="cnt">+</span>' : "");
  }
  function chipPileHtml(amount) {
    const parts = chipBreakdown(amount);
    if (!parts.length) return "";
    return parts.map((c) => {
      const shown = Math.min(c.n, 4);
      const discs = Array.from({ length: shown }, () => '<span class="pile-disc" style="background:' + c.color + '"></span>').join("");
      return '<span class="chip-pile" title="' + c.v + ' × ' + c.n + '"><span class="pile-discs">' + discs + '</span><span class="pile-n">' + (c.n > 4 ? "4+" : c.n) + '</span></span>';
    }).join("");
  }
  function potStackHtml(amount) {
    let n = Math.max(0, Math.floor(Number(amount || 0) / 10));
    if (!n) return "";
    const shown = Math.min(n, 10);
    const discs = Array.from({ length: shown }, (_, i) =>
      '<span class="pile-disc" style="background:' + (i % 2 ? "#e9e1d2" : "#d8c9ad") + '"></span>').join("");
    return '<span class="chip-pile" title="底池筹码 ' + n + ' 枚"><span class="pile-discs">' + discs + '</span><span class="pile-n">' + (n > 10 ? "10+" : n) + '</span></span>';
  }
  function potScatterHtml(amount) {
    // 底池要把筹码“散开”而不是只画一个大面额：优先拆成 10/20/50 的小堆。
    let rem = Math.max(0, Math.floor(Number(amount || 0) / 10) * 10);
    const vals = [];
    const mix = [10, 10, 20, 10, 50, 10, 20, 100, 10, 20];
    let k = 0;
    while (rem >= 10 && vals.length < 36) {
      const v = mix[k++ % mix.length];
      if (rem >= v) { vals.push(v); rem -= v; }
      else if (rem >= 10) { vals.push(10); rem -= 10; }
    }
    const spots = [[-78,-10],[ -52,8],[-28,-13],[-8,11],[14,-9],[36,9],[58,-6],[78,7],[-64,18],[-40,-2],[-14,15],[10,-2],[34,15],[58,17],[76,-12],[-80,20],[-58,-18],[-30,20],[-2,-18],[26,-19],[50,-15],[72,15],[82,-2],[-84,4],[-44,22],[44,22],[0,0],[-20,5],[20,6],[-70,2],[70,-18],[-10,24],[14,24],[-46,-22],[46,-24],[0,-22]];
    return vals.map((v, i) => {
      const q = spots[i % spots.length];
      return '<span class="chip v' + v + ' pot-chip" style="left:calc(50% + ' + q[0] + 'px);top:calc(50% + ' + q[1] + 'px);transform:translate(-50%,-50%) rotate(' + ((i * 37) % 40 - 20) + 'deg)"></span>';
    }).join("") + (rem >= 10 ? '<span class="pot-more">+' + fmt(rem) + '</span>' : "");
  }
  function animateChips(info) {
    if (!info || !info.amount) return;
    const layer = document.getElementById("chip-layer");
    const seats = document.querySelectorAll("#seats .seat");
    const seat = seats[info.seat];
    if (!layer || !seat) return;
    const shellRect = document.getElementById("table-shell").getBoundingClientRect();
    const seatRect = seat.getBoundingClientRect();
    const potRect = document.getElementById("pot").getBoundingClientRect();
    const seatX = seatRect.left + seatRect.width / 2 - shellRect.left;
    const seatY = seatRect.top + seatRect.height / 2 - shellRect.top;
    const potX = potRect.left + potRect.width / 2 - shellRect.left;
    const potY = potRect.top + potRect.height / 2 - shellRect.top;
    const change = info.kind === "change";
    const startX = change ? potX : seatX;
    const startY = change ? potY : seatY;
    const tx = change ? seatX : potX;
    const ty = change ? seatY : potY;
    const fly = document.createElement("div");
    fly.className = "chip-fly";
    const parts = chipBreakdown(info.amount);
    let html = "";
    let n = 0;
    parts.forEach((c) => { for (let i = 0; i < Math.min(c.n, info.kind === "change" ? 5 : 4) && n < 10; i++) { html += '<span class="chip v' + c.v + '"></span>'; n++; } });
    fly.innerHTML = html || '<span class="chip v10"></span>';
    fly.style.left = startX + "px";
    fly.style.top = startY + "px";
    layer.appendChild(fly);
    requestAnimationFrame(() => {
      fly.style.transform = "translate(" + (tx - startX) + "px," + (ty - startY) + "px) scale(.72)";
      fly.style.opacity = "0.2";
    });
    setTimeout(() => fly.remove(), 560);
  }
  function gatherPotChips(info) {
    if (!info || !info.pot) return;
    const layer = document.getElementById("chip-layer");
    const stack = document.getElementById("pot-stack");
    if (!layer || !stack) return;
    const shellRect = document.getElementById("table-shell").getBoundingClientRect();
    const targetRect = stack.getBoundingClientRect();
    const tx = targetRect.left + Math.min(18, targetRect.width / 2) - shellRect.left;
    const ty = targetRect.top + targetRect.height / 2 - shellRect.top;
    document.querySelectorAll("#pot-chips .pot-chip").forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const sx = r.left + r.width / 2 - shellRect.left;
      const sy = r.top + r.height / 2 - shellRect.top;
      const clone = document.createElement("span");
      clone.className = "gather-chip " + el.className.replace("pot-chip", "");
      clone.style.left = sx + "px";
      clone.style.top = sy + "px";
      clone.innerHTML = '<span class="chip v' + (el.className.match(/v(\d+)/) || [0, 10])[1] + '"></span>';
      layer.appendChild(clone);
      requestAnimationFrame(() => {
        clone.style.transform = "translate(" + (tx - sx) + "px," + (ty - sy) + "px) scale(.62)";
        clone.style.opacity = ".15";
      });
      setTimeout(() => clone.remove(), 600);
    });
  }
  function selectedTotal() { return selectedChips.reduce((s, v) => s + v, 0); }
  function selectedCount(v) { return selectedChips.filter((x) => x === v).length; }
  function addChip(v) {
    if (!game || game.actor !== 0) return;
    const hero = game.players[0];
    const parts = chipBreakdown(hero.stack);
    const avail = (parts.find((p) => p.v === v) || { n: 0 }).n;
    if (selectedCount(v) >= avail) return;
    selectedChips.push(v);
    renderTray();
  }
  function removeChip(v) {
    const i = selectedChips.indexOf(v);
    if (i >= 0) { selectedChips.splice(i, 1); renderTray(); }
  }
  function clearSelected() { selectedChips = []; }
  function presetTarget(kind) {
    if (!game) return 0;
    const g = game, hero = g.players[0];
    const maxTo = hero.bet + hero.stack;
    const pot = g.pot + g.players.reduce((s, p) => s + p.bet, 0);
    let target;
    if (kind === "min") target = g.minRaiseTo();
    else if (kind === "half") target = g.currentBet + Math.max(g.minRaise, Math.round(pot * 0.5 / 10) * 10);
    else target = g.currentBet + Math.max(g.minRaise, Math.round(pot / 10) * 10);
    return Math.min(maxTo, Math.max(g.minRaiseTo(), Math.round(target / 10) * 10));
  }
  function pickChipsForNeed(need) {
    need = Math.round(Number(need || 0) / 10) * 10;
    if (need <= 0) return null;
    const units = need / 10;
    const hero = game.players[0];
    const parts = chipBreakdown(hero.stack);
    const dp = Array(units + 1).fill(null);
    dp[0] = [];
    for (const c of parts) {
      for (let k = 0; k < c.n; k++) {
        const v = c.v / 10;
        for (let s = units; s >= v; s--) {
          if (!dp[s] && dp[s - v]) dp[s] = dp[s - v].concat([c.v]);
        }
      }
    }
    return dp[units] ? dp[units].slice() : null;
  }
  function applyPreset(kind) {
    if (!game || game.actor !== 0) return;
    const hero = game.players[0];
    const target = presetTarget(kind);
    const need = target - hero.bet;
    const chips = pickChipsForNeed(need);
    if (!chips || target <= game.currentBet) return;
    selectedChips = chips.slice();
    renderTray();
  }
  function renderTray() {
    const tray = document.getElementById("bet-tray");
    if (!tray || !game) return;
    const g = game, hero = g.players[0];
    const canAct = g.actor === 0 && g.street !== "ended" && g.street !== "showdown" && !hero.folded && !hero.allIn;
    const toCall = Math.max(0, g.currentBet - hero.bet);
    const maxTo = hero.bet + hero.stack;
    const minTo = g.minRaiseTo();
    const total = selectedTotal();
    const parts = chipBreakdown(hero.stack);
    const counts = {};
    parts.forEach((c) => { counts[c.v] = (counts[c.v] || 0) + c.n; });
    if (!canAct) {
      tray.innerHTML = '<span class="need">等待你的回合</span>';
    } else {
      // 缺门的面额也保留按钮，只变灰，不消失。
      tray.innerHTML = CHIP_SET.slice().reverse().map((c) => {
        const have = counts[c.v] || 0;
        const used = selectedCount(c.v);

        const cls = "tray-chip" + (used ? " selected" : "") + (have === 0 ? " empty" : "");
        return '<button type="button" class="' + cls + '" data-v="' + c.v + '"' + (avail <= 0 ? " disabled" : "") + '>' +
          '<span class="chip v' + c.v + '">' + c.label + '</span><span class="cnt">剩 ' + Math.max(0, avail) + '</span>' +
          (used ? '<span class="sel">' + used + '</span>' : '') + '</button>';
      }).join("") + (selectedChips.length ? '<button type="button" class="tray-chip" id="clear-chips"><span class="cnt">清空</span></button>' : "");
      tray.querySelectorAll(".tray-chip[data-v]").forEach((b) => {
        b.onclick = (e) => { e.preventDefault(); addChip(Number(b.dataset.v)); };
        b.oncontextmenu = (e) => { e.preventDefault(); removeChip(Number(b.dataset.v)); };
      });
      const clr = document.getElementById("clear-chips");
      if (clr) clr.onclick = () => { clearSelected(); renderTray(); };
      document.querySelectorAll("#raise-presets button").forEach((b) => {
        const target = presetTarget(b.dataset.target);
        const chips = canAct ? pickChipsForNeed(target - hero.bet) : null;
        const legal = !!(canAct && chips && target > g.currentBet && target >= minTo && target <= maxTo);
        b.disabled = !legal;
        b.title = legal ? "自动选取正好 " + fmt(target - hero.bet) + " 筹码" : "现有筹码无法精确凑出该目标";
        b.onclick = () => applyPreset(b.dataset.target);
      });
    }
    // 预设按钮始终保留；不能行动或无法用现有筹码精确凑出时变灰。
    document.querySelectorAll("#raise-presets button").forEach((b) => {
      const target = presetTarget(b.dataset.target);
      const chips = canAct ? pickChipsForNeed(target - hero.bet) : null;
      const legal = !!(canAct && chips && target > g.currentBet && target >= minTo && target <= maxTo);
      b.disabled = !legal;
      b.title = legal ? "自动选取正好 " + fmt(target - hero.bet) + " 筹码" : "现有筹码无法精确凑出该目标";
      b.onclick = () => applyPreset(b.dataset.target);
    });
    document.getElementById("selected-total").textContent = fmt(total);
    const hint = document.getElementById("bet-hint");
    const target = hero.bet + total;
    let mode = "none";
    if (total > 0 && toCall > 0 && total < toCall) mode = "short_call";
    else if (total === toCall && toCall > 0) mode = "call";
    else if (total > 0 && target > g.currentBet && target >= minTo) mode = "raise";
    else if (total > 0 && total > toCall) mode = "short_raise";
    else if (total === 0 && toCall === 0) mode = "check";
    const canBet = canAct && (mode === "call" || mode === "raise");
    const btn = document.getElementById("act-bet");
    const opening = g.currentBet === 0;
    btn.disabled = !canBet;
    btn.textContent = mode === "call" ? "跟注" : mode === "raise" ? (target >= maxTo ? "全下" : (opening ? "下注" : "加注")) : "下注";
    if (!canAct) hint.innerHTML = '<span class="need">等待行动</span>';
    else if (mode === "short_call") hint.innerHTML = '<span class="need">跟注还差 ' + fmt(toCall - total) + '</span>';
    else if (mode === "call") hint.innerHTML = '<span>自动识别：跟注 ' + fmt(toCall) + '</span>';
    else if (mode === "raise") hint.innerHTML = '<span>自动识别：' + (opening ? '下注到 ' : '加注到 ') + fmt(target) + '</span>';
    else if (mode === "short_raise") hint.innerHTML = '<span class="need">加注不足，至少选 ' + fmt(minTo - hero.bet) + ' 筹码</span>';
    else if (mode === "check") hint.innerHTML = '<span>未选筹码，可以过牌</span>';
    else if (toCall > 0) hint.innerHTML = '<span>请选筹码：跟注 ' + fmt(toCall) + ' 或更多</span>';
    else hint.innerHTML = '<span>请选筹码下注</span>';
  }
  function renderChipLegend() {
    const el = document.getElementById("chip-legend");
    if (el) el.innerHTML = '<span class="lbl">筹码</span>' + CHIP_SET.slice().reverse().map((c) =>
      '<span class="chip v' + c.v + '" title="' + c.v + '">' + c.label + '</span>').join("");
  }
  function log(text, cls) {
    const box = $('#log');
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
  function logHand(text) {
    const div = document.createElement('div');
    div.className = 'hand';
    div.textContent = text;
    $('#log').appendChild(div);
    $('#log').scrollTop = $('#log').scrollHeight;
  }
  function totalChips() {
    const n = Number($('#set-players').value);
    const requested = Math.max(600, Number($('#set-chips').value) || 6000);
    // 每人筹码必须是 10 的倍数；总池按人数×每人筹码归一化，保证人人完全相等。
    const stack = Math.floor(requested / n / 10) * 10;
    const total = stack * n;
    return { n, requested, total, stack, adjusted: total !== requested };
  }
  function refreshSetup() {
    const { n, requested, total, stack, adjusted } = totalChips();
    $('#set-stack').textContent = fmt(stack) + (adjusted ? '（已按每人 10 取整，输入 ' + fmt(requested) + '）' : '');
    $('#table-summary').textContent = n + ' 人桌 · 全桌 ' + fmt(total) + ' 筹码';
    const list = $('#ai-difficulty-list');
    const current = {};
    list.querySelectorAll('select').forEach((s) => { current[s.dataset.seat] = s.value; });
    list.innerHTML = '';
    for (let i = 1; i < n; i++) {
      const item = document.createElement('label');
      item.className = 'ai-item';
      item.innerHTML = '<span>AI ' + i + '</span><select class="select" data-seat="' + i + '">' +
        ['easy:简单', 'medium:中等', 'hard:困难', 'hell:地狱'].map((x) => {
          const [v, label] = x.split(':');
          const iters = (window.HoldemAI && HoldemAI.ITERATIONS[v]) || 0;
          return '<option value="' + v + '"' + ((current[i] || 'medium') === v ? ' selected' : '') + '>' + label + ' · ' + iters + ' 次</option>';
        }).join('') + '</select>';
      list.appendChild(item);
    }
  }
  function readDifficulties(n) {
    const out = {};
    for (let i = 1; i < n; i++) {
      const sel = document.querySelector('#ai-difficulty-list select[data-seat="' + i + '"]');
      out[i] = sel ? sel.value : 'medium';
    }
    return out;
  }
  function startGame() {
    const { n, total, stack } = totalChips();
    if (stack < 100) { alert('每位玩家至少需要 100 筹码'); return; }
    const diffs = readDifficulties(n);
    game = new Holdem.Game({
      players: n,
      totalChips: total,
      startingStack: stack,
      difficulties: diffs,
      humanName: '你',
      sb: 10,
      bb: 20,
    });
    $('#setup-view').classList.add('hidden');
    $('#game-view').classList.remove('hidden');
    $('#gameover-modal').classList.add('hidden');
    $('#log').innerHTML = '';
    game.onUpdate = render;
    game.onLog = (text, cls) => log(text, cls);
    game.onHandLog = (text) => logHand(text);
    game.onHandStart = onHandStart;
    game.onHandResult = onHandResult;
    game.onChipMove = animateChips;
    game.onRoundEnd = gatherPotChips;
    game.onGameOver = (info) => showGameOver(info);
    game.onAiAction = scheduleAi;
    ACH_STREAK = 0;
    game.start();
    // 等布局完成再量一次尺寸，避免首帧用未稳定高度把座位画大后立刻缩小。
    requestAnimationFrame(() => { if (game) render(); });
  }
  function showGameOver(info) {
    if (info.winner === '你') unlockAch('tournament_win');
    $('#gameover-title').textContent = info.winner === '你' ? '你赢了' : '牌局结束';
    $('#gameover-text').textContent = info.text;
    $('#gameover-modal').classList.remove('hidden');
  }
  function chipTooltipHtml(player) {
    const parts = chipBreakdown(player.stack);
    return '<div class="chip-tip-title">' + player.name + ' · 筹码 ' + fmt(player.stack) + '<small>每种面额的实际分配</small></div>' +
      (parts.length ? parts.map((c) =>
        '<div class="chip-tip-row"><span class="chip v' + c.v + '">' + c.label + '</span><span class="cnt">×' + c.n + '</span><span class="val">' + fmt(c.v * c.n) + '</span></div>'
      ).join('') : '<div class="chip-tip-row"><span class="cnt">无筹码</span></div>');
  }
  function showChipTooltip(seatIndex, seat) {
    const tip = document.getElementById('chip-tooltip');
    if (!tip || !game || !game.players[seatIndex]) return;
    tip.innerHTML = chipTooltipHtml(game.players[seatIndex]);
    tip.classList.remove('hidden');
    const r = seat.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = r.right + 10;
    if (left + tw > innerWidth - 8) left = r.left - tw - 10;
    left = Math.max(8, Math.min(innerWidth - tw - 8, left));
    let top = r.top;
    top = Math.max(8, Math.min(innerHeight - th - 8, top));
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideChipTooltip() {
    const tip = document.getElementById('chip-tooltip');
    if (tip) tip.classList.add('hidden');
  }
  function render() {
    if (!game) return;
    const g = game;
    const liveBets = g.players.reduce((s, p) => s + p.bet, 0);
    const shownPot = g.pot + liveBets;
    $('#pot').textContent = fmt(shownPot);
    $('#pot-chips').innerHTML = potScatterHtml(liveBets);
    $('#pot-stack').innerHTML = potStackHtml(g.pot);
    $('#street').textContent = g.street.toUpperCase();
    $('#community').innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const box = document.createElement('span');
      box.innerHTML = cardHtml(g.board[i], '');
      $('#community').appendChild(box.firstElementChild);
    }
    $('#seats').innerHTML = '';
    const shell = $('#table-shell');
    const tableBox = shell.getBoundingClientRect();
    // 用稳定外框尺寸计算，避免第一次渲染时如果布局尚未完成导致座位先大后小。
    const W = tableBox.width - 20, H = tableBox.height - 20;
    const n = g.players.length;
    const marginX = 24, marginY = 24;
    const boardH = Math.max(160, document.querySelector('.board-center').getBoundingClientRect().height || 195);
    const rowMax = Math.max(3, Math.ceil(n / 2));
    const widthScale = (W - marginX * 2 - (rowMax - 1) * 8) / (rowMax * 190);
    const verticalScale = (H - boardH - marginY * 2 - 16) / (2 * 150);
    const scale = Math.max(0.30, Math.min(0.96, widthScale, verticalScale));
    const seatW = 190 * scale, seatH = 150 * scale;
    const topCount = n - Math.ceil(n / 2);
    const topPlayers = g.players.slice(1, 1 + topCount);
    const bottomAIs = g.players.slice(1 + topCount);
    const mid = Math.floor(bottomAIs.length / 2);
    const bottomPlayers = bottomAIs.slice(0, mid).concat([g.players[0]], bottomAIs.slice(mid));
    const rowXs = (count) => {
      if (count <= 1) return [(marginX + W - marginX) / 2];
      const left = marginX + seatW / 2;
      const right = W - marginX - seatW / 2;
      const step = (right - left) / (count - 1);
      return Array.from({ length: count }, (_, i) => left + step * i);
    };
    const topY = marginY + seatH / 2;
    const bottomY = H - marginY - seatH / 2 - 24;
    const makeSeat = (p, i, x, y) => {
      const seat = document.createElement('div');
      seat.className = 'seat' + (i === 0 ? ' you' : '') + (i === g.actor && g.street !== 'ended' && g.street !== 'showdown' ? ' active' : '') + (p.folded ? ' folded' : '') + (p.allIn ? ' allin' : '');
      seat.style.left = x + 'px';
      seat.style.top = y + 'px';
      seat.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
      const hole = p.hole && p.hole.length ? p.hole.map((c) => cardHtml(c, 'small')).join('') : backCard('small') + backCard('small');
      seat.innerHTML = '<div class="nm"><span>' + p.name + '</span><span>' + (p.isHuman ? 'YOU' : p.difficultyLabel) + '</span></div>' +
        '<div class="stk">' + fmt(p.stack) + '</div>' +
        '<div class="meta">' + (p.folded ? '已弃牌' : p.allIn ? 'ALL-IN' : p.acted ? '已行动' : '') + (p.bet ? ' · 注 ' + fmt(p.bet) : '') + '</div>' +
        '<div class="cards">' + (p.isHuman || g.street === 'showdown' ? hole : backCard('small') + backCard('small')) + '</div>' +
        (i === g.dealer ? '<span class="dealer">D</span>' : '');
      seat.dataset.seat = String(p.seat);
      seat.addEventListener('mouseenter', () => showChipTooltip(p.seat, seat));
      seat.addEventListener('mouseleave', hideChipTooltip);
      $('#seats').appendChild(seat);
    };
    const xsTop = rowXs(topPlayers.length);
    topPlayers.forEach((p, k) => makeSeat(p, p.seat, xsTop[k], topY));
    const xsBottom = rowXs(bottomPlayers.length);
    bottomPlayers.forEach((p, k) => makeSeat(p, p.seat, xsBottom[k], bottomY));
    // 不同浏览器对缩放后实际高度有 1~2px 差异，最后把底排收回桌内并保留边距。
    const tableRect = shell.getBoundingClientRect();
    document.querySelectorAll('#seats .seat').forEach((el) => {
      const r = el.getBoundingClientRect();
      const over = r.bottom - (tableRect.bottom - 20);
      if (over > 0) el.style.top = ((parseFloat(el.style.top) || 0) - over) + 'px';
    });
    const hero = g.players[0];
    $('#hero-name').textContent = hero.name;
    $('#hero-stack').textContent = '筹码 ' + fmt(hero.stack) + ' · 本轮下注 ' + fmt(hero.bet);
    $('#hero-hole').innerHTML = (hero.hole || []).map((c) => cardHtml(c, '')).join('');
    $('#hero-hint').textContent = g.street === 'ended' ? '牌局结束' : g.actor === 0 ? '轮到你行动' : '等待其他玩家…';
    const toCall = Math.max(0, g.currentBet - hero.bet);
    $('#act-check').classList.toggle('hidden', toCall > 0);
    const canAct = g.actor === 0 && g.street !== 'ended' && g.street !== 'showdown' && !hero.folded && !hero.allIn;
    ['act-fold', 'act-check', 'act-bet'].forEach((id) => { $('#' + id).disabled = !canAct; });
    if (!canAct) selectedChips = [];
    renderTray();
  }
  function scheduleAi() {
    if (!game || game.street === 'ended' || game.street === 'showdown') return;
    const p = game.players[game.actor];
    if (!p || p.isHuman) return;
    setTimeout(() => {
      if (!game || game.actor !== p.seat || game.street === 'ended') return;
      const action = HoldemAI.decide(game.aiView(p.seat));
      game.act(action);
    }, AI_DELAY + Math.random() * 250);
  }
  function doAct(action) {
    if (!game || game.actor !== 0) return;
    const g = game, hero = g.players[0];
    const toCall = Math.max(0, g.currentBet - hero.bet);
    const total = selectedTotal();
    if (action === 'fold') { clearSelected(); g.act({ type: 'fold' }); return; }
    if (action === 'check') { clearSelected(); g.act({ type: 'check' }); return; }
    if (action !== 'bet' || total <= 0) return;
    if (toCall > 0) {
      if (total < toCall) return;
      if (total === toCall) {
        unlockAch('first_call');
        clearSelected();
        g.act({ type: 'call' });
        return;
      }
      const target = hero.bet + total;
      if (target <= g.currentBet || target < g.minRaiseTo()) return;
      unlockAch('first_raise');
      clearSelected();
      g.act({ type: 'raise', amount: target });
      return;
    }
    const target = hero.bet + total;
    if (target <= g.currentBet || target < g.minRaiseTo()) return;
    unlockAch('first_raise');
    clearSelected();
    g.act({ type: 'raise', amount: target });
  }
  $('#act-fold').onclick = () => doAct('fold');
  $('#act-check').onclick = () => doAct('check');
  $('#act-bet').onclick = () => doAct('bet');
  $('#set-players').onchange = refreshSetup;
  $('#set-chips').oninput = refreshSetup;
  $('#start-game').onclick = startGame;
  $('#gameover-again').onclick = startGame;
  $('#gameover-close').onclick = () => { $('#gameover-modal').classList.add('hidden'); $('#game-view').classList.add('hidden'); $('#setup-view').classList.remove('hidden'); refreshSetup(); };
  window.addEventListener('resize', () => { if (game) render(); });
  window.__holdem = { get game() { return game; }, startGame, loadAchievements };
  document.getElementById('ach-btn').onclick = () => { renderAch(); document.getElementById('ach-modal').classList.remove('hidden'); };
  document.getElementById('ach-close').onclick = () => document.getElementById('ach-modal').classList.add('hidden');
  renderChipLegend();
  loadAchievements();
  refreshSetup();
  $('#setup-view').classList.remove('hidden');
})();
</script>
</body>
</html>
