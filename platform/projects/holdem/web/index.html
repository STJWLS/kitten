<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/template.css">
<title>德州扑克 · KittenPuppy4Ever</title>
<style>
  body { background: radial-gradient(circle at 50% 20%, #153b2e, #071b14 70%); }
  .page { max-width: 1180px; }
  .holdem-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .holdem-head h2 { margin:0; color:#f7edd8; font-size:28px; letter-spacing:.12em; text-shadow:0 2px 12px rgba(0,0,0,.35); }
  .holdem-head .sub { color:#c8d8cb; font-size:13px; line-height:1.7; }
  .holdem-layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:14px; align-items:start; }
  .table-shell { position:relative; min-height:610px; padding:22px; border-radius:26px;
    background:radial-gradient(ellipse at center, #1f6b4f 0%, #124534 55%, #0a2b21 100%);
    border:10px solid #5b3a22; box-shadow:inset 0 0 60px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.35); }
  .felt-ring { position:absolute; inset:32px; border:2px solid rgba(238,218,170,.25); border-radius:50%; pointer-events:none; }
  .board-center { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(560px,78%); text-align:center; }
  .pot-line { color:#f0d597; font-size:13px; letter-spacing:.10em; margin-bottom:9px; }
  .pot-line b { font-size:27px; color:#ffe7a2; font-variant-numeric:tabular-nums; text-shadow:0 2px 10px rgba(0,0,0,.3); }
  .community { display:flex; justify-content:center; gap:9px; min-height:102px; align-items:center; }
  .street { color:#cfe0d2; font-size:12px; letter-spacing:.16em; text-transform:uppercase; margin-top:10px; }
  .seat { position:absolute; width:146px; min-height:102px; padding:8px 10px; border-radius:15px;
    background:rgba(8,22,17,.78); border:1px solid rgba(231,210,168,.25); color:#e8f0e6;
    box-shadow:0 8px 20px rgba(0,0,0,.25); transform:translate(-50%,-50%); transition:border-color .2s, box-shadow .2s; }
  .seat.you { border-color:#e7b96a; box-shadow:0 0 0 1px rgba(231,185,106,.45), 0 8px 20px rgba(0,0,0,.3); }
  .seat.active { border-color:#8be0ae; box-shadow:0 0 0 1px rgba(139,224,174,.5), 0 0 24px rgba(83,210,143,.22); }
  .seat.folded { opacity:.45; filter:grayscale(.6); }
  .seat.allin { border-color:#e07a6a; }
  .seat .nm { display:flex; justify-content:space-between; gap:5px; font-size:12.5px; color:#f2e8d3; }
  .seat .stk { font-size:17px; font-weight:800; color:#ffe7a2; margin-top:2px; letter-spacing:.02em; }
  .seat .meta { font-size:10.5px; color:#a9c2b0; margin-top:2px; }
  .seat .cards { display:flex; gap:3px; margin-top:6px; min-height:30px; }
  .seat .bet { position:absolute; right:8px; bottom:-11px; font-size:10px; color:#17130d; background:#e7c77d;
    border-radius:999px; padding:1px 6px; white-space:nowrap; }
  .seat .dealer { position:absolute; left:-8px; top:-8px; width:21px; height:21px; border-radius:50%;
    background:#f4eee2; color:#173f30; font-size:9px; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .card { position:relative; width:38px; height:54px; border-radius:6px; background:#fffdf8; color:#1b1b1b; border:1px solid #d9cdb8;
    display:flex; flex-direction:column; align-items:center; justify-content:center; font:700 13px/1.05 "Times New Roman", serif;
    box-shadow:0 2px 5px rgba(0,0,0,.18); }
  .card.red { color:#b02a26; }
  .card.back { background:repeating-linear-gradient(135deg,#9b3d38 0 4px,#b9554d 4px 8px); border-color:#6e2825; color:transparent; }
  .card.small { width:31px; height:44px; font-size:11px; }
  .card.empty { background:rgba(255,255,255,.06); border:1px dashed rgba(255,255,255,.22); box-shadow:none; }
  .card .rank { display:block; font:800 15px/.95 Georgia, "Times New Roman", serif; letter-spacing:.02em; }
  .card .suit { display:block; font-size:12px; line-height:1; margin-top:2px; }
  .card.ace .rank { font-size:26px; letter-spacing:0; }
  .card.king .rank, .card.queen .rank, .card.jack .rank { font-size:21px; letter-spacing:-.02em; }
  .card.ace::before, .card.king::before, .card.queen::before, .card.jack::before {
    position:absolute; right:3px; top:2px; font-size:8px; line-height:1; color:currentColor; opacity:.42;
  }
  .card.ace::before { content:"✦"; }
  .card.king::before { content:"♚"; }
  .card.queen::before { content:"♛"; }
  .card.jack::before { content:"♞"; }
  .card.king .suit, .card.queen .suit, .card.jack .suit { font-size:13px; }
  .card.small .rank { font-size:13px; }
  .card.small .suit { font-size:10px; margin-top:1px; }
  .card.small.ace .rank { font-size:20px; }
  .card.small.king .rank, .card.small.queen .rank, .card.small.jack .rank { font-size:15px; }
  .card.small.ace .suit, .card.small.king .suit, .card.small.queen .suit, .card.small.jack .suit { font-size:11px; }
  .hero-panel { margin-top:14px; padding:12px 14px; border-radius:16px; background:rgba(8,22,17,.82); border:1px solid rgba(231,210,168,.22); color:#e8f0e6; }
  .hero-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .hero-row .who { font-size:14px; font-weight:800; color:#ffe7a2; }
  .hero-row .hint { font-size:12px; color:#a9c2b0; }
  .controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .controls .range { flex:1; min-width:130px; accent-color:#d7b367; }
  .controls .amount { width:76px; text-align:center; font-variant-numeric:tabular-nums; }
  .btn-poker { border:1px solid rgba(231,210,168,.4); background:#214d3c; color:#f6ebd4; }
  .btn-poker.primary { background:#c7954b; border-color:#e2c080; color:#1d160d; font-weight:700; }
  .btn-poker.danger { background:#632f2b; border-color:#9c5148; }
  .log-panel { border-radius:16px; background:rgba(8,22,17,.82); border:1px solid rgba(231,210,168,.2); padding:12px; color:#c8d8cb; }
  .log-panel h2 { margin:0 0 8px; font:600 13px "Songti SC", serif; letter-spacing:.12em; color:#e7c77d; }
  #log { height:470px; overflow:auto; font-size:12px; line-height:1.75; }
  #log .hand { color:#e7c77d; border-top:1px dashed rgba(231,210,168,.16); padding-top:5px; margin-top:5px; }
  #log .win { color:#9fe1b8; }
  #log .lose { color:#e7a19a; }
  .setup-card { max-width:700px; margin:0 auto; border-radius:20px; padding:20px; background:rgba(8,22,17,.92);
    border:1px solid rgba(231,210,168,.28); color:#f3ead9; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .setup-card h2 { margin:0 0 4px; font:700 28px "Songti SC", serif; letter-spacing:.14em; color:#ffe7a2; }
  .setup-card p { color:#b3c9ba; font-size:12.5px; line-height:1.8; }
  .setup-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:14px 0; }
  .setup-grid label { font-size:12px; color:#d5e3d7; }
  .setup-grid input, .setup-grid select { display:block; width:100%; margin-top:4px; }
  .ai-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin:10px 0; }
  .ai-item { display:flex; align-items:center; gap:7px; font-size:12px; color:#d5e3d7; background:rgba(255,255,255,.04); border:1px solid rgba(231,210,168,.14); border-radius:9px; padding:6px 8px; }
  .ai-item span { flex:1; }
  .ai-item select { width:130px; }
  .modal .setup-card { margin: 5vh auto; }
  .gameover { color:#ffe7a2; }
  .hidden { display:none !important; }
  @media (max-width: 900px) {
    .holdem-layout { grid-template-columns:1fr; }
    .table-shell { min-height:520px; padding:12px; border-width:7px; }
    .seat { width:126px; min-height:92px; }
    .seat .cards .card { width:28px; height:40px; }
    .seat .stk { font-size:15px; }
    .log-panel { order:2; }
    #log { height:180px; }
  }
  @media (max-width: 620px) {
    .table-shell { min-height:470px; }
    .seat { width:94px; min-height:76px; padding:5px; }
    .seat .stk { font-size:12px; }
    .seat .cards .card { width:22px; height:32px; font-size:9px; }
    .board-center { width:90%; }
    .community .card { width:27px; height:39px; font-size:11px; }
    .setup-grid, .ai-list { grid-template-columns:1fr; }
  }


  /* chips */
  .chip-legend { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin:4px 0 0; }
  .chip-legend .lbl { font-size:9px; color:#8fa99a; letter-spacing:.08em; margin-right:2px; }
  .chip { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    font-size:7.5px; font-weight:800; color:#1c1710; border:2px solid rgba(255,255,255,.35);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.28), 0 1px 2px rgba(0,0,0,.25); flex:none; }
  .chip.v10 { background:#e9e1d2; }
  .chip.v20 { background:#5e9bd8; color:#fff; }
  .chip.v50 { background:#5ca66f; color:#fff; }
  .chip.v100 { background:#34343a; color:#fff; }
  .chip.v200 { background:#a276c2; color:#fff; }
  .chip.v500 { background:#d8784c; color:#fff; }
  .chip.v1000 { background:#d8b44e; }
  .chip-legend .chip { width:23px; height:23px; font-size:6.5px; }
  .chip-stack { display:flex; align-items:center; gap:3px; flex-wrap:wrap; margin-top:3px; }
  .chip-stack .chip { width:15px; height:15px; font-size:6px; border-width:1px; }
  .chip-stack .cnt { font-size:9px; color:#f0dfbb; margin-right:1px; }
  .seat-chips { display:flex; gap:2px; margin-top:3px; min-height:14px; align-items:center; }
  .seat-chips .chip { width:15px; height:15px; font-size:5.5px; border-width:1px; }
  .seat .bet-chips { position:absolute; right:6px; bottom:10px; display:flex; gap:1px; }
  .seat .bet-chips .chip { width:12px; height:12px; font-size:4.5px; border-width:1px; }
  .pot-chips { position:relative; width:min(260px,70%); height:36px; margin:0 auto 4px; }
  .pot-chips .chip { position:absolute; width:17px; height:17px; font-size:5.5px; border-width:1px; }
  .pot-more { position:absolute; right:0; bottom:-2px; font-size:8px; color:#e7c77d; }
  .seat-chips { display:flex; gap:2px; align-items:flex-end; min-height:28px; margin-top:3px; }
  .chip-pile { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; width:16px; min-height:24px; }
  .pile-discs { display:flex; flex-direction:column-reverse; align-items:center; justify-content:flex-start; }
  .pile-disc { display:block; width:15px; height:4px; border-radius:50%; margin-top:-1px; border:1px solid rgba(255,255,255,.28); box-shadow:0 1px 0 rgba(0,0,0,.28); }
  .pile-n { font-size:7px; line-height:1; color:#f0dfbb; margin-top:1px; text-shadow:0 1px 2px #000; }
  .bet-tray-wrap { margin-top:7px; padding-top:6px; border-top:1px solid rgba(231,210,168,.16); }
  .bet-tray-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11px; color:#b9cbbb; }
  .bet-tray-head b { color:#ffe7a2; font-size:14px; font-variant-numeric:tabular-nums; }
  .bet-tray-head .change { color:#9fe1b8; }
  .bet-tray-head .need { color:#e7a19a; }
  .bet-tray { display:flex; align-items:center; gap:7px; flex-wrap:wrap; min-height:44px; margin-top:4px; }
  .tray-chip { position:relative; display:flex; flex-direction:column; align-items:center; gap:1px; padding:2px 4px 1px; border-radius:9px;
    border:1px solid rgba(231,210,168,.18); background:rgba(255,255,255,.035); cursor:pointer; user-select:none; }
  .tray-chip:hover { border-color:rgba(231,185,106,.55); background:rgba(255,255,255,.07); }
  .tray-chip.selected { border-color:#e7c77d; background:rgba(231,199,125,.16); }
  .tray-chip .chip { width:28px; height:28px; font-size:8px; }
  .tray-chip .cnt { font-size:8px; color:#d5e3d7; }
  .tray-chip .sel { position:absolute; right:-4px; top:-5px; min-width:14px; height:14px; padding:0 3px; border-radius:999px;
    background:#c7954b; color:#1d160d; font-size:8px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .raise-presets { display:flex; gap:4px; margin-left:auto; }
  .raise-presets button { font-size:9px; padding:2px 6px; border-radius:7px; border:1px solid rgba(231,210,168,.25);
    background:rgba(255,255,255,.04); color:#d5e3d7; cursor:pointer; }
  .raise-presets button:hover { border-color:#e7c77d; color:#ffe7a2; }
  .chip-layer { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:30; }
  .chip-fly { position:absolute; display:flex; flex-wrap:wrap; width:54px; gap:2px; will-change:transform; transition:transform .48s cubic-bezier(.22,.7,.3,1), opacity .48s ease; }
  .chip-fly .chip { width:18px; height:18px; font-size:6px; }
  @media (max-width: 620px) {
    .chip-legend { gap:4px; }
    .chip-legend .chip { width:18px; height:18px; font-size:5px; }
    .seat-chips .chip { width:12px; height:12px; font-size:4.5px; }
  }
  /* viewport-fit: no page scrolling; only internal log / achievement list scrolls */
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; }
  .page { max-width: none; width: 100%; height: 100dvh; min-height: 0; padding: 8px 14px 10px; display: flex; flex-direction: column; overflow: hidden; }
  .holdem-head { flex: 0 0 auto; margin-bottom: 6px; }
  #setup-view.section, #game-view.section { flex: 1; min-height: 0; padding: 0; border: 0; box-shadow: none; background: transparent; overflow: hidden; }
  #setup-view { display: flex; align-items: center; justify-content: center; overflow: auto; }
  #game-view { display: flex; flex-direction: column; }
  .holdem-layout { flex: 1; min-height: 0; height: 100%; align-items: stretch; }
  .holdem-layout > div:first-child { display: flex; flex-direction: column; min-height: 0; height: 100%; }
  .table-shell { flex: 1; min-height: 0; height: auto; }
  .hero-panel { flex: 0 0 auto; margin-top: 8px; }
  .log-panel { height: 100%; min-height: 0; display: flex; flex-direction: column; }
  #log { flex: 1; height: auto; min-height: 0; }
  .setup-card { max-height: calc(100dvh - 110px); overflow: auto; }
  .ach-btn { border: 1px solid rgba(231,185,106,.45); background: rgba(8,22,17,.65); color: #ffe7a2; border-radius: 999px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 11px; }
  .ach-btn:hover { background: rgba(35,62,48,.9); }
  .ach-modal .setup-card { width: min(760px, 92vw); max-height: calc(100dvh - 80px); }
  .ach-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .ach-head h2 { margin:0; font:700 20px "Songti SC",serif; color:#ffe7a2; }
  .ach-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
  .ach-item { display:flex; gap:8px; align-items:flex-start; padding:7px 8px; border-radius:9px; border:1px solid rgba(231,210,168,.14); background:rgba(255,255,255,.035); }
  .ach-item .ico { font-size:18px; line-height:1; }
  .ach-item .tt { font-size:11px; font-weight:700; color:#f2e8d3; }
  .ach-item .dd { font-size:10px; color:#9eb8a7; line-height:1.45; margin-top:1px; }
  .ach-item .tier { margin-left:auto; font-size:8.5px; color:#c7a96a; white-space:nowrap; }
  .ach-item.locked { opacity:.42; filter:grayscale(1); }
  #ach-toast { position:fixed; right:18px; top:18px; z-index:300; padding:10px 13px; border-radius:12px; background:#fbf6ea; color:#3a3028; border:1px solid #e7c77d; box-shadow:0 10px 30px rgba(0,0,0,.25); opacity:0; transform:translateY(-8px); transition:opacity .2s, transform .2s; pointer-events:none; max-width:300px; }
  #ach-toast.show { opacity:1; transform:translateY(0); }
  #ach-toast b { display:block; font-size:12px; color:#9e2a22; }
  #ach-toast span { display:block; font-size:10px; color:#7a6448; margin-top:2px; }
  @media (max-height: 720px) {
    .holdem-head .sub { display:none; }
    .holdem-head h2 { font-size:20px; }
    .hero-panel { padding:8px 10px; margin-top:6px; }
    .controls { margin-top:6px; }
  }
  @media (max-width: 900px) {
    .holdem-layout { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) 128px; }
    .holdem-layout > div:first-child { height: auto; min-height: 0; }
    .log-panel { height: 128px; flex: 0 0 128px; order: 2; }
    #log { height: auto; }
    .table-shell { min-height: 0; }
    .seat { width: 110px; min-height: 82px; }
    .seat .cards .card { width: 27px; height: 39px; }
    .ach-list { grid-template-columns:1fr; }
  }
  @media (max-width: 620px) {
    .page { padding: 4px 6px 6px; }
    .holdem-head { margin-bottom: 3px; }
    .table-shell { min-height: 0; padding: 6px; border-width: 5px; }
    .seat { width: 88px; min-height: 70px; padding: 4px; }
    .seat .nm { font-size:9px; }
    .seat .stk { font-size:11px; }
    .seat .meta { display:none; }
    .seat .cards .card { width:20px; height:29px; font-size:8px; }
    .board-center { width: 92%; }
    .community .card { width:24px; height:35px; font-size:10px; }
    .hero-panel { font-size:10px; }
    .hero-row .hint { font-size:9px; }
    .controls .range { min-width:70px; }
    .controls .btn { font-size:10px; padding:5px 7px; }
    .holdem-layout { grid-template-rows:minmax(0,1fr) 92px; }
    .log-panel { height: 92px; flex-basis:92px; }
    .setup-card { padding:12px; }
  }

  @media (max-width: 620px) {
    .seat-chips { gap:0; max-width:100%; overflow:hidden; min-height:22px; }
    .chip-pile { width:12px; min-height:20px; }
    .chip-pile:nth-child(n+5) { display:none; }
    .pile-disc { width:11px; height:3px; margin-top:-1px; }
    .pile-n { font-size:6px; }
    .pot-chips { height:32px; }
    .pot-chips .chip { width:14px; height:14px; font-size:4.5px; }
    .bet-tray { gap:4px; min-height:38px; }
    .tray-chip .chip { width:24px; height:24px; font-size:7px; }
    .tray-chip { padding:1px 2px; }
    .tray-chip .cnt { font-size:7px; }
    .raise-presets button { font-size:8px; padding:1px 4px; }
  }
</style>
</head>
<body data-project="holdem">
<main class="page">
  <div class="holdem-head">
    <div>
      <h2>德州扑克</h2>
      <div class="sub">无限注 · 6–10 人 · AI 只能看到自己的手牌与公共牌</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="sub" id="table-summary">选择一个牌桌开始</div>
      <button class="ach-btn" id="ach-btn" type="button">🏆 <span id="ach-count">0 / 0</span></button>
    </div>
  </div>
  <div class="chip-legend" id="chip-legend"></div>

  <section class="section hidden" id="setup-view">
    <div class="setup-card">
      <h2>开局设置</h2>
      <p>牌桌人数 6–10 人。每位 AI 只能读取自己的手牌、公共牌和公开下注信息，不会看到其他玩家的手牌或牌堆。AI 难度越高，胜率模拟次数越多。</p>
      <div class="setup-grid">
        <label>牌桌人数
          <select id="set-players" class="select">
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          </select>
        </label>
        <label>全桌总筹码
          <input id="set-chips" class="input" type="number" min="600" step="100" value="6000">
        </label>
        <label>小盲 / 大盲
          <span class="input" id="set-blinds" style="display:block;padding:7px 9px;color:#e7c77d">10 / 20（固定）</span>
        </label>
        <label>每人起始筹码
          <span class="input" id="set-stack" style="display:block;padding:7px 9px;color:#e7c77d">—</span>
        </label>
      </div>
      <div class="sm-label" style="color:#e7c77d">AI 难度</div>
      <div class="ai-list" id="ai-difficulty-list"></div>
      <div class="toolbar" style="justify-content:flex-end">
        <button class="btn btn-poker primary" id="start-game" type="button">开始牌局</button>
      </div>
    </div>
  </section>

  <section class="section hidden" id="game-view">
    <div class="holdem-layout">
      <div>
        <div class="table-shell" id="table-shell">
          <div class="felt-ring"></div>
          <div class="chip-layer" id="chip-layer"></div>
          <div class="board-center">
            <div class="pot-line">底池 <b id="pot">0</b></div>
            <div class="pot-chips" id="pot-chips"></div>
            <div class="community" id="community"></div>

                <button type="button" data-target="min">最小</button>
                <button type="button" data-target="half">半池</button>

</main>
<script src="engine.js"></script>
<script src="ai.js"></script>
<script>
/* UI controller is kept separate from the rules engine and AI policy. */
(() => {
  const $ = (s) => document.querySelector(s);
  let game = null;
  let AI_DELAY = 650;
  let ACHIEVEMENTS = [];
  let ACH_STATE = {};
  let ACH_PENDING = [];
  let selectedChips = [];
  let raiseTarget = null;
  let ACH_HELL_IN_HAND = false;
  let ACH_STREAK = 0;
  let ACH_HAND_START_STACK = 0;
  const ACH_TIER = { easy: "简单", medium: "中等", hard: "困难", hell: "极限" };
  const ACH_KEY = () => "kp_achievements_" + (localStorage.getItem("kp_login_user") || "guest");
  function loadAchState() {
    try { ACH_STATE = JSON.parse(localStorage.getItem(ACH_KEY()) || "{}") || {}; } catch (e) { ACH_STATE = {}; }
  }
  function saveAchState() {
    try { localStorage.setItem(ACH_KEY(), JSON.stringify(ACH_STATE)); } catch (e) {}
  }
  function escHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function renderAch() {
    const done = ACHIEVEMENTS.filter((a) => ACH_STATE[a.id]).length;
    const count = document.getElementById("ach-count");
    if (count) count.textContent = done + " / " + ACHIEVEMENTS.length;
    const list = document.getElementById("ach-list");
    if (!list) return;
    list.innerHTML = ACHIEVEMENTS.map((a) => {
      const on = !!ACH_STATE[a.id];
      return '<div class="ach-item' + (on ? "" : " locked") + '"><span class="ico">' + escHtml(a.icon || "🏆") + '</span>' +
        '<span><span class="tt">' + escHtml(a.title) + '</span><span class="dd">' + escHtml(a.desc || "") + '</span></span>' +
        '<span class="tier">' + escHtml(ACH_TIER[a.tier] || "") + '</span></div>';
    }).join("") || '<div class="dd">成就加载中…</div>';
  }
  function achToast(def) {
    if (window.parent !== window) return; // shell handles the Steam toast
    const el = document.getElementById("ach-toast");
    if (!el) return;
    document.getElementById("ach-toast-title").textContent = "成就解锁 · " + def.title;
    document.getElementById("ach-toast-desc").textContent = def.desc || "";
    el.classList.add("show");
    clearTimeout(achToast._t);
    achToast._t = setTimeout(() => el.classList.remove("show"), 3200);
  }
  function unlockAch(id) {
    if (!id) return;
    if (!ACHIEVEMENTS.length) { if (!ACH_PENDING.includes(id)) ACH_PENDING.push(id); return; }
    const def = ACHIEVEMENTS.find((a) => a.id === id);
    if (!def || ACH_STATE[id]) return;
    ACH_STATE[id] = new Date().toISOString();
    saveAchState();
    renderAch();
    achToast(def);
    try {
      if (window.parent !== window) {
        window.parent.postMessage({ kpAchievement: { game: "holdem", id: def.id, title: def.title, desc: def.desc, icon: def.icon } }, "*");
      }
    } catch (e) {}
  }
  async function loadAchievements() {
    loadAchState();
    try {
      const r = await fetch("/api/p/holdem/state", {cache: "no-store"});
      const j = await r.json();
      const arr = j && j.manifest && j.manifest.ui && j.manifest.ui.achievements;
      ACHIEVEMENTS = Array.isArray(arr) ? arr : [];
    } catch (e) { ACHIEVEMENTS = []; }
    ACH_PENDING.forEach((id) => unlockAch(id));
    ACH_PENDING = [];
    renderAch();
  }
  const ACH_CATEGORY = { "一对": "pair", "两对": "two_pair", "三条": "trips", "顺子": "straight", "同花": "flush", "葫芦": "full_house", "四条": "quads", "同花顺": "straight_flush" };
  function onHandStart(info) {
    clearSelected();
    ACH_HAND_START_STACK = Number(info.humanStartStack) || 0;
    ACH_HELL_IN_HAND = !!(game && game.players.some((p) => p.difficulty === "hell"));
    unlockAch("first_hand");
  }
  function onHandResult(r) {
    if (!r) return;
    const human = game && game.players[0];
    const won = Array.isArray(r.winners) && r.winners.includes(0);
    if (r.showdown && !r.humanFolded) {
      unlockAch("first_showdown");
      if (r.humanHand && r.humanHand.name && ACH_CATEGORY[r.humanHand.name]) unlockAch(ACH_CATEGORY[r.humanHand.name]);
    }
    if (!r.humanFolded) unlockAch("no_fold");
    if (won) {
      unlockAch("first_win");
      ACH_STREAK += 1;
      if (ACH_STREAK >= 3) unlockAch("three_streak");
      if (!r.showdown) unlockAch("win_no_showdown");
      if (r.humanBlind === "sb" || r.humanBlind === "bb") unlockAch("blind_win");
      if (r.humanAllIn) unlockAch("all_in_win");
      if (Number(r.pot) >= 500) unlockAch("big_pot");
      if (ACH_HAND_START_STACK > 0 && ACH_HAND_START_STACK < 100) unlockAch("comeback");
      if (ACH_HELL_IN_HAND) unlockAch("hell_slayer");
    } else {
      ACH_STREAK = 0;
    }
  }
  function cardHtml(card, cls) {
    if (!card) return '<span class="card empty ' + (cls || '') + '"></span>';
    const red = card.s === 'h' || card.s === 'd';
    const honor = ({A:'ace', K:'king', Q:'queen', J:'jack'})[card.r] || '';
    return '<span class="card ' + (red ? 'red ' : '') + honor + (honor ? ' ' : '') + (cls || '') + '">' +
      '<span class="rank">' + card.r + '</span><span class="suit">' + (Holdem.SUIT_NAME[card.s] || card.s) + '</span></span>';
  }
  function backCard(cls) { return '<span class="card back ' + (cls || '') + '"></span>'; }
  function fmt(n) { return Number(n || 0).toLocaleString('zh-CN'); }
  const CHIP_SET = [
    { v: 1000, label: "1K", color: "#d8b44e", cap: 2 },
    { v: 500, label: "500", color: "#d8784c", cap: 1 },
    { v: 200, label: "200", color: "#a276c2", cap: 1 },
    { v: 100, label: "100", color: "#34343a", cap: 1 },
    { v: 50, label: "50", color: "#5ca66f", cap: 2 },
    { v: 20, label: "20", color: "#5e9bd8", cap: 2 },
    { v: 10, label: "10", color: "#e9e1d2", cap: 5 },
  ];
  function chipBreakdown(amount) {
    let rem = Math.max(0, Math.floor(Number(amount || 0) / 10) * 10);
    const out = [];
    for (const c of CHIP_SET) {
      let n = Math.floor(rem / c.v);
      let cap = c.cap;
      if (c.v === 1000 && rem < 2000) cap = 0; // 1000 以下用中低面额组成，视觉上更像筹码堆
      if (n > cap) n = cap;
      if (n > 0) { out.push({ ...c, n }); rem -= n * c.v; }
    }
    // 低面额被 cap 截断后，剩余并入已有的 10 筹码堆
    if (rem >= 10) {
      const ten = out.find((c) => c.v === 10);
      if (ten) ten.n += Math.floor(rem / 10);
      else out.push({ v: 10, label: "10", color: "#e9e1d2", n: Math.floor(rem / 10) });
    }
    return out;
  }
  function chipHtml(amount, opts = {}) {
    const parts = chipBreakdown(amount);
    if (!parts.length) return "";
    const max = opts.max || 5;
    const small = opts.small ? " small" : "";
    return parts.slice(0, max).map((c) =>
      '<span class="chip v' + c.v + small + '" title="' + c.v + ' × ' + c.n + '">' + c.label + '</span>' +
      (c.n > 1 ? '<span class="cnt">×' + c.n + '</span>' : '')
    ).join("") + (parts.length > max ? '<span class="cnt">+</span>' : "");
  }
  function chipPileHtml(amount) {
    const parts = chipBreakdown(amount);
    if (!parts.length) return "";
    return parts.map((c) => {
      const shown = Math.min(c.n, 4);
      const discs = Array.from({ length: shown }, () => '<span class="pile-disc" style="background:' + c.color + '"></span>').join("");
      return '<span class="chip-pile" title="' + c.v + ' × ' + c.n + '"><span class="pile-discs">' + discs + '</span><span class="pile-n">' + (c.n > 4 ? "4+" : c.n) + '</span></span>';
    }).join("");
  }
  function potScatterHtml(amount) {
    // 底池要把筹码“散开”而不是只画一个大面额：优先拆成 10/20/50 的小堆。
    let rem = Math.max(0, Math.floor(Number(amount || 0) / 10) * 10);
    const vals = [];
    const mix = [10, 10, 20, 10, 50, 10, 20, 100, 10, 20];
    let k = 0;
    while (rem >= 10 && vals.length < 36) {
      const v = mix[k++ % mix.length];
      if (rem >= v) { vals.push(v); rem -= v; }
      else if (rem >= 10) { vals.push(10); rem -= 10; }
    }
    const spots = [[-78,-10],[ -52,8],[-28,-13],[-8,11],[14,-9],[36,9],[58,-6],[78,7],[-64,18],[-40,-2],[-14,15],[10,-2],[34,15],[58,17],[76,-12],[-80,20],[-58,-18],[-30,20],[-2,-18],[26,-19],[50,-15],[72,15],[82,-2],[-84,4],[-44,22],[44,22],[0,0],[-20,5],[20,6],[-70,2],[70,-18],[-10,24],[14,24],[-46,-22],[46,-24],[0,-22]];
    return vals.map((v, i) => {
      const q = spots[i % spots.length];
      return '<span class="chip v' + v + ' pot-chip" style="left:calc(50% + ' + q[0] + 'px);top:calc(50% + ' + q[1] + 'px);transform:translate(-50%,-50%) rotate(' + ((i * 37) % 40 - 20) + 'deg)"></span>';
    }).join("") + (rem >= 10 ? '<span class="pot-more">+' + fmt(rem) + '</span>' : "");
  }
  function animateChips(info) {
    if (!info || !info.amount) return;
    const layer = document.getElementById("chip-layer");
    const seats = document.querySelectorAll("#seats .seat");
    const seat = seats[info.seat];
    if (!layer || !seat) return;
    const shellRect = document.getElementById("table-shell").getBoundingClientRect();
    const seatRect = seat.getBoundingClientRect();
    const potRect = document.getElementById("pot").getBoundingClientRect();
    const seatX = seatRect.left + seatRect.width / 2 - shellRect.left;
    const seatY = seatRect.top + seatRect.height / 2 - shellRect.top;
    const potX = potRect.left + potRect.width / 2 - shellRect.left;
    const potY = potRect.top + potRect.height / 2 - shellRect.top;
    const change = info.kind === "change";
    const startX = change ? potX : seatX;
    const startY = change ? potY : seatY;
    const tx = change ? seatX : potX;
    const ty = change ? seatY : potY;
    const fly = document.createElement("div");
    fly.className = "chip-fly";
    const parts = chipBreakdown(info.amount);
    let html = "";
    let n = 0;
    parts.forEach((c) => { for (let i = 0; i < Math.min(c.n, info.kind === "change" ? 5 : 4) && n < 10; i++) { html += '<span class="chip v' + c.v + '"></span>'; n++; } });
    fly.innerHTML = html || '<span class="chip v10"></span>';
    fly.style.left = startX + "px";
    fly.style.top = startY + "px";
    layer.appendChild(fly);
    requestAnimationFrame(() => {
      fly.style.transform = "translate(" + (tx - startX) + "px," + (ty - startY) + "px) scale(.72)";
      fly.style.opacity = "0.2";
    });
    setTimeout(() => fly.remove(), 560);
  }
  function selectedTotal() { return selectedChips.reduce((s, v) => s + v, 0); }
  function selectedCount(v) { return selectedChips.filter((x) => x === v).length; }
  function addChip(v) {
    if (!game || game.actor !== 0) return;
    const hero = game.players[0];
    const parts = chipBreakdown(hero.stack);
    const avail = (parts.find((p) => p.v === v) || { n: 0 }).n;
    if (selectedCount(v) >= avail) return;
    selectedChips.push(v);
    render();
  }
  function removeChip(v) {
    const i = selectedChips.indexOf(v);
    if (i >= 0) { selectedChips.splice(i, 1); render(); }
  }
  function clearSelected() { selectedChips = []; raiseTarget = null; }
  function presetTarget(kind) {
    if (!game) return 0;
    const g = game, hero = g.players[0];
    const maxTo = hero.bet + hero.stack;
    const pot = g.pot + g.players.reduce((s, p) => s + p.bet, 0);
    let target;
    if (kind === "min") target = g.minRaiseTo();
    else if (kind === "half") target = g.currentBet + Math.max(g.minRaise, Math.round(pot * 0.5 / 10) * 10);
    else target = g.currentBet + Math.max(g.minRaise, Math.round(pot / 10) * 10);
    return Math.min(maxTo, Math.max(g.minRaiseTo(), Math.round(target / 10) * 10));
  }
  function renderTray() {
    const tray = document.getElementById("bet-tray");
    const presets = document.getElementById("raise-presets");
    if (!tray || !game) return;
    const g = game, hero = g.players[0];
    const canAct = g.actor === 0 && g.street !== "ended" && g.street !== "showdown" && !hero.folded && !hero.allIn;
    const toCall = Math.max(0, g.currentBet - hero.bet);
    const maxTo = hero.bet + hero.stack;
    const minTo = g.minRaiseTo();
    const total = selectedTotal();
    const parts = chipBreakdown(hero.stack);
    if (!canAct) { tray.innerHTML = '<span class="need">等待你的回合</span>'; presets.querySelectorAll("button").forEach((b) => b.disabled = true); }
    else {
      tray.innerHTML = parts.map((c) => {
        const used = selectedCount(c.v);
        const avail = c.n - used;
        return '<button type="button" class="tray-chip' + (used ? " selected" : "") + '" data-v="' + c.v + '"' + (avail <= 0 ? " disabled" : "") + '>' +
          '<span class="chip v' + c.v + '">' + c.label + '</span><span class="cnt">剩 ' + avail + '</span>' +
          (used ? '<span class="sel">' + used + '</span>' : '') + '</button>';
      }).join("") + (selectedChips.length ? '<button type="button" class="tray-chip" id="clear-chips"><span class="cnt">清空</span></button>' : "");
      tray.querySelectorAll(".tray-chip[data-v]").forEach((b) => {
        b.onclick = (e) => { e.preventDefault(); addChip(Number(b.dataset.v)); };
        b.oncontextmenu = (e) => { e.preventDefault(); removeChip(Number(b.dataset.v)); };
      });
      const clr = document.getElementById("clear-chips");
      if (clr) clr.onclick = () => { clearSelected(); render(); };
      presets.querySelectorAll("button").forEach((b) => {
        b.disabled = false;
        b.classList.toggle("active", raiseTarget === presetTarget(b.dataset.target));
        b.onclick = () => { raiseTarget = presetTarget(b.dataset.target); render(); };
      });
    }
    document.getElementById("selected-total").textContent = fmt(total);
    const hint = document.getElementById("bet-hint");
    const callChange = toCall > 0 ? total - toCall : 0;
    let target = raiseTarget || (hero.bet + total);
    target = Math.min(maxTo, Math.max(0, target));
    let needRaise = Math.max(0, target - hero.bet);
    if (raiseTarget) target = raiseTarget;
    const canCall = canAct && toCall > 0 && total >= toCall;
    const canRaise = canAct && total > 0 && (raiseTarget ? total >= needRaise : (total >= minTo - hero.bet)) && target > g.currentBet;
    document.getElementById("act-call").disabled = !canCall;
    document.getElementById("act-raise").disabled = !canRaise;
    document.getElementById("act-raise").textContent = target >= maxTo ? "全下" : "加注";
    if (!canAct) hint.innerHTML = '<span class="need">等待行动</span>';
    else if (raiseTarget) {
      if (total >= needRaise) hint.innerHTML = '<span class="change">加注到 ' + fmt(raiseTarget) + '，从底池找零 ' + fmt(Math.max(0, total - needRaise)) + '</span>';
      else hint.innerHTML = '<span class="need">加注还差 ' + fmt(needRaise - total) + '</span>';
    }
    else if (toCall > 0 && total < toCall) hint.innerHTML = '<span class="need">跟注还差 ' + fmt(toCall - total) + '</span>';
    else if (toCall > 0 && total >= toCall) hint.innerHTML = '<span class="change">跟注，从底池找零 ' + fmt(Math.max(0, callChange)) + '</span>';
    else hint.innerHTML = '<span>加注到 ' + fmt(target) + '</span>';
  }
  function renderChipLegend() {
    const el = document.getElementById("chip-legend");
    if (el) el.innerHTML = '<span class="lbl">筹码</span>' + CHIP_SET.slice().reverse().map((c) =>
      '<span class="chip v' + c.v + '" title="' + c.v + '">' + c.label + '</span>').join("");
  }
  function log(text, cls) {
    const box = $('#log');
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
  function logHand(text) {
    const div = document.createElement('div');
    div.className = 'hand';
    div.textContent = text;
    $('#log').appendChild(div);
    $('#log').scrollTop = $('#log').scrollHeight;
  }
  function totalChips() {
    const n = Number($('#set-players').value);
    const total = Math.max(600, Number($('#set-chips').value) || 6000);
    return { n, total, stack: Math.floor(total / n), remainder: total - Math.floor(total / n) * n };
  }
  function refreshSetup() {
    const { n, total, stack, remainder } = totalChips();
    $('#set-stack').textContent = fmt(stack) + (remainder ? '（余 ' + remainder + ' 给 1 号位）' : '');
    $('#table-summary').textContent = n + ' 人桌 · 全桌 ' + fmt(total) + ' 筹码';
    const list = $('#ai-difficulty-list');
    const current = {};
    list.querySelectorAll('select').forEach((s) => { current[s.dataset.seat] = s.value; });
    list.innerHTML = '';
    for (let i = 1; i < n; i++) {
      const item = document.createElement('label');
      item.className = 'ai-item';
      item.innerHTML = '<span>AI ' + i + '</span><select class="select" data-seat="' + i + '">' +
        ['easy:简单', 'medium:中等', 'hard:困难', 'hell:地狱'].map((x) => {
          const [v, label] = x.split(':');
          const iters = (window.HoldemAI && HoldemAI.ITERATIONS[v]) || 0;
          return '<option value="' + v + '"' + ((current[i] || 'medium') === v ? ' selected' : '') + '>' + label + ' · ' + iters + ' 次</option>';
        }).join('') + '</select>';
      list.appendChild(item);
    }
  }
  function readDifficulties(n) {
    const out = {};
    for (let i = 1; i < n; i++) {
      const sel = document.querySelector('#ai-difficulty-list select[data-seat="' + i + '"]');
      out[i] = sel ? sel.value : 'medium';
    }
    return out;
  }
  function startGame() {
    const { n, total, stack } = totalChips();
    if (stack < 100) { alert('每位玩家至少需要 100 筹码'); return; }
    const diffs = readDifficulties(n);
    game = new Holdem.Game({
      players: n,
      totalChips: total,
      startingStack: stack,
      difficulties: diffs,
      humanName: '你',
      sb: 10,
      bb: 20,
    });
    $('#setup-view').classList.add('hidden');
    $('#game-view').classList.remove('hidden');
    $('#gameover-modal').classList.add('hidden');
    $('#log').innerHTML = '';
    game.onUpdate = render;
    game.onLog = (text, cls) => log(text, cls);
    game.onHandLog = (text) => logHand(text);
    game.onHandStart = onHandStart;
    game.onHandResult = onHandResult;
    game.onChipMove = animateChips;
    game.onGameOver = (info) => showGameOver(info);
    game.onAiAction = scheduleAi;
    ACH_STREAK = 0;
    game.start();
  }
  function showGameOver(info) {
    if (info.winner === '你') unlockAch('tournament_win');
    $('#gameover-title').textContent = info.winner === '你' ? '你赢了' : '牌局结束';
    $('#gameover-text').textContent = info.text;
    $('#gameover-modal').classList.remove('hidden');
  }
  function render() {
    if (!game) return;
    const g = game;
    const shownPot = g.pot + g.players.reduce((s, p) => s + p.bet, 0);
    $('#pot').textContent = fmt(shownPot);
    $('#pot-chips').innerHTML = potScatterHtml(shownPot);
    $('#street').textContent = g.street.toUpperCase();
    $('#community').innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const box = document.createElement('span');
      box.innerHTML = cardHtml(g.board[i], '');
      $('#community').appendChild(box.firstElementChild);
    }
    $('#seats').innerHTML = '';
    const shell = $('#table-shell');
    const W = shell.clientWidth, H = shell.clientHeight;
    const cx = W / 2, cy = H / 2 + 10;
    const rx = Math.min(W * 0.41, 430), ry = Math.min(H * 0.39, 225);
    g.players.forEach((p, i) => {
      const a = Math.PI / 2 + (i / g.players.length) * Math.PI * 2;
      const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
      const seat = document.createElement('div');
      seat.className = 'seat' + (i === 0 ? ' you' : '') + (i === g.actor && g.street !== 'ended' && g.street !== 'showdown' ? ' active' : '') + (p.folded ? ' folded' : '') + (p.allIn ? ' allin' : '');
      seat.style.left = x + 'px'; seat.style.top = y + 'px';
      const hole = p.hole && p.hole.length ? p.hole.map((c) => cardHtml(c, 'small')).join('') : backCard('small') + backCard('small');
      seat.innerHTML = '<div class="nm"><span>' + p.name + '</span><span>' + (p.isHuman ? 'YOU' : p.difficultyLabel) + '</span></div>' +
        '<div class="stk">' + fmt(p.stack) + '</div>' +
        '<div class="meta">' + (p.folded ? '已弃牌' : p.allIn ? 'ALL-IN' : p.acted ? '已行动' : '') + '</div>' +
        '<div class="cards">' + (i === 0 || g.street === 'showdown' ? hole : backCard('small') + backCard('small')) + '</div>' +
        '<div class="seat-chips">' + chipPileHtml(p.stack) + '</div>' +
        (p.bet ? '<span class="bet">' + fmt(p.bet) + '</span><span class="bet-chips">' + chipHtml(p.bet, {max: 3, small: true}) + '</span>' : '') +
        (i === g.dealer ? '<span class="dealer">D</span>' : '');
      $('#seats').appendChild(seat);
    });
    const hero = g.players[0];
    $('#hero-name').textContent = hero.name;
    $('#hero-stack').textContent = '筹码 ' + fmt(hero.stack) + ' · 本轮下注 ' + fmt(hero.bet);
    $('#hero-hole').innerHTML = (hero.hole || []).map((c) => cardHtml(c, '')).join('');
    $('#hero-hint').textContent = g.street === 'ended' ? '牌局结束' : g.actor === 0 ? '轮到你行动' : '等待其他玩家…';
    const toCall = Math.max(0, g.currentBet - hero.bet);
    $('#act-check').classList.toggle('hidden', toCall > 0);
    $('#act-call').classList.toggle('hidden', toCall <= 0);
    $('#act-call').textContent = toCall > 0 ? '跟注' : '跟注';
    const canAct = g.actor === 0 && g.street !== 'ended' && g.street !== 'showdown' && !hero.folded && !hero.allIn;
    ['act-fold', 'act-check', 'act-call', 'act-raise'].forEach((id) => { $('#' + id).disabled = !canAct; });
    if (!canAct) { selectedChips = []; raiseTarget = null; }
    renderTray();
  }
  function scheduleAi() {
    if (!game || game.street === 'ended' || game.street === 'showdown') return;
    const p = game.players[game.actor];
    if (!p || p.isHuman) return;
    setTimeout(() => {
      if (!game || game.actor !== p.seat || game.street === 'ended') return;
      const action = HoldemAI.decide(game.aiView(p.seat));
      game.act(action);
    }, AI_DELAY + Math.random() * 250);
  }
  function doAct(action) {
    if (!game || game.actor !== 0) return;
    const g = game, hero = g.players[0];
    const toCall = Math.max(0, g.currentBet - hero.bet);
    const total = selectedTotal();
    let change = 0;
    if (action === 'fold') unlockAch('first_fold');
    if (action === 'check') unlockAch('first_check');
    if (action === 'call') {
      if (total < toCall) return;
      change = total - toCall;
      unlockAch('first_call');
    }
    if (action === 'raise') {
      const target = raiseTarget || (hero.bet + total);
      if (target <= g.currentBet || target < g.minRaiseTo()) return;
      const need = target - hero.bet;
      if (total < need) return;
      change = total - need;
      unlockAch('first_raise');
      clearSelected();
      g.act({ type: 'raise', amount: target });
      if (change > 0) animateChips({ seat: 0, amount: change, kind: 'change' });
      render();
      return;
    }
    if (action === 'call') {
      clearSelected();
      g.act({ type: 'call' });
      if (change > 0) animateChips({ seat: 0, amount: change, kind: 'change' });
      render();
      return;
    }
    clearSelected();
    g.act({ type: action });
    render();
  }
  $('#act-fold').onclick = () => doAct('fold');
  $('#act-check').onclick = () => doAct('check');
  $('#act-call').onclick = () => doAct('call');
  $('#act-raise').onclick = () => doAct('raise');
  $('#set-players').onchange = refreshSetup;
  $('#set-chips').oninput = refreshSetup;
  $('#start-game').onclick = startGame;
  $('#gameover-again').onclick = startGame;
  $('#gameover-close').onclick = () => { $('#gameover-modal').classList.add('hidden'); $('#game-view').classList.add('hidden'); $('#setup-view').classList.remove('hidden'); refreshSetup(); };
  window.addEventListener('resize', () => { if (game) render(); });
  window.__holdem = { get game() { return game; }, startGame, loadAchievements };
  document.getElementById('ach-btn').onclick = () => { renderAch(); document.getElementById('ach-modal').classList.remove('hidden'); };
  document.getElementById('ach-close').onclick = () => document.getElementById('ach-modal').classList.add('hidden');
  renderChipLegend();
  loadAchievements();
  refreshSetup();
  $('#setup-view').classList.remove('hidden');
})();
</script>
</body>
</html>
